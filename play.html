function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake>0.5) ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);

  if(state==='TITLE'){ drawTitle(); ctx.restore(); drawRotateHint(); return; }
  if(state==='MODE'){ drawMode(); ctx.restore(); drawRotateHint(); return; }
  if(state==='DIFF'){ drawDiff(); ctx.restore(); drawRotateHint(); return; }
  if(state==='STAGE'){ drawStageSelect(); ctx.restore(); drawRotateHint(); return; }
  if(state==='SELECT'){ drawSelect(); ctx.restore(); drawRotateHint(); return; }
  if(state==='VS'){ drawVS(); ctx.restore(); drawRotateHint(); return; }
  if(state==='KEYIN'){ drawKeyIn(); ctx.restore(); drawRotateHint(); return; }

  drawStage();
  if(fighters[0]&&fighters[1]){
    const order = fighters[0].y<=fighters[1].y ? [0,1] : [1,0];
    drawFighter(fighters[order[0]]); drawFighter(fighters[order[1]]);
  }
  drawProjectiles();
  drawFX();
  if(state!=='FINISH') drawHUD();
  drawTopBtns();
  if(TOUCH && state==='FIGHT' && !paused) drawPads();

  if(state==='ROUND_INTRO'){
    bigText(stateT<900? 'טייק '+round : 'אקשן!', '', stateT<900?'#fff':'#ff5e3a');
    const prog=Math.min(1,stateT/700);
    ctx.save(); ctx.translate(W/2,H/2-215);
    ctx.fillStyle='#16161c'; rr(ctx,-92,-6,184,62,6); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='700 16px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('VIDEO FIGHT',0,14);
    ctx.font='600 12px Arial'; ctx.fillStyle='#9aa';
    ctx.fillText('TAKE '+round+' · '+stageDef(stageId).name,0,38);
    ctx.save(); ctx.translate(-92,-6); ctx.rotate(-(1-prog)*0.5);
    for(let i=0;i<6;i++){ ctx.fillStyle=i%2?'#eee':'#16161c';
      ctx.beginPath(); ctx.moveTo(i*31,0); ctx.lineTo(i*31+23,0);
      ctx.lineTo(i*31+8,-16); ctx.lineTo(i*31-15,-16); ctx.closePath(); ctx.fill(); }
    ctx.restore(); ctx.restore();
  }
  if(state==='ROUND_END'){
    bigText('קאט!','', '#ff5e3a');
    if(stateT>1500 && wins[0]<2 && wins[1]<2){
      ctx.font='700 26px -apple-system, Arial'; ctx.fillStyle='#fff'; ctx.textAlign='center';
      ctx.fillText('הטייק הבא מתחיל…', W/2, H/2+120);
    }
  }
  if(state==='FINISH'){
    ctx.fillStyle='rgba(6,4,12,.35)'; ctx.fillRect(0,0,W,H);
    if(finish.phase===0){
      ctx.font='900 30px -apple-system, Arial'; ctx.textAlign='center'; ctx.fillStyle='#fff';
      ctx.fillText(finish.winner?finish.winner.char.sup:'', W/2, 300);
    }
  }
  if(state==='MATCH_END'){
    const wSlot=wins[0]>=2?0:1, winner=fighters[wSlot];
    ctx.fillStyle='rgba(10,6,20,.6)'; ctx.fillRect(0,0,W,H);
    for(const c of confetti){ ctx.fillStyle=c.col; ctx.fillRect(c.x,c.y,c.r,c.r*1.4); }
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='900 76px -apple-system, "Arial Black", Arial';
    ctx.shadowColor='rgba(0,0,0,.8)'; ctx.shadowBlur=20; ctx.shadowOffsetY=4;
    ctx.fillStyle='#ffd34d'; ctx.fillText('המנצח!', W/2, 88);
    ctx.shadowOffsetY=0; ctx.shadowBlur=0;
    if(winner){
      ctx.save(); ctx.translate(W/2,548); drawHeadSplit(ctx, winner, 1.0); ctx.restore();
      ctx.font='900 44px -apple-system, Arial'; ctx.fillStyle='#fff';
      ctx.shadowColor='rgba(0,0,0,.8)'; ctx.shadowBlur=10;
      ctx.fillText(winner.data.name+' · '+winner.char.art, W/2, 592);
      ctx.shadowBlur=0;
      if(winner.bubble){
        ctx.font='700 26px -apple-system, Arial';
        const bw=ctx.measureText(winner.bubble).width+36;
        ctx.fillStyle='rgba(255,255,255,.96)'; rr(ctx,W/2-bw/2,142,bw,48,14); ctx.fill();
        ctx.fillStyle='#181820'; ctx.fillText(winner.bubble,W/2,166);
      }
    }
    if(stateT>1600){
      for(const [r,label] of [[MB_REMATCH,'🔁 עוד טייק'],[MB_CHANGE,'🔀 החלפת דמויות']]){
        ctx.fillStyle='rgba(255,211,77,.16)'; rr(ctx,r[0],r[1],r[2],r[3],14); ctx.fill();
        ctx.strokeStyle='#ffd34d'; ctx.lineWidth=2.5; rr(ctx,r[0],r[1],r[2],r[3],14); ctx.stroke();
        ctx.font='800 24px -apple-system, Arial'; ctx.fillStyle='#ffd34d';
        ctx.fillText(label, r[0]+r[2]/2, r[1]+r[3]/2+1);
      }
      ctx.font='600 14px -apple-system, Arial'; ctx.fillStyle='rgba(255,255,255,.45)';
      ctx.fillText('בימוי: אלי · ציוד: דודי · סאונד: תומר · תאורה: עדי · עריכה: אביב · לקוחות: גאי · כלבה ראשית: נינה',
        W/2, 700);
    }
  }
  if(paused&&state==='FIGHT'){
    ctx.fillStyle='rgba(5,5,12,.8)'; ctx.fillRect(0,0,W,H);
    bigText('הפסקת אוכל', TOUCH?'לחצו כדי לחזור לסט':'P — חוזרים לסט');

      ctx.fillText('⚡ '+fighters[0].char.sp1+'  ·  ⬇⚡ '+fighters[0].char.sp2+'  ·  🔥 '+fighters[0].char.sup,
        W/2, H/2+140);
    }
  }
  ctx.restore();
  drawRotateHint();
}
function drawRotateHint(){
  if(!(TOUCH && innerHeight>innerWidth)) return;

function frame(now){
  const dt=Math.min(100, now-lastFrame); lastFrame=now; acc+=dt;
  let steps=0;
  while(acc>=DT && steps<4){ update(); acc-=DT; steps++; }
  acc=Math.min(acc, DT*2);
  render();
  requestAnimationFrame(frame);
}

  edG.restore();
  const my=d.cal.mouthFrac*HEADH*0.94 + (HEADH-4-HEADH*0.94);
  edG.strokeStyle='rgba(255,211,77,.9)'; edG.lineWidth=2; edG.setLineDash([7,5]);
  edG.beginPath(); edG.moveTo(6,my); edG.lineTo(HEADW-6,my); edG.stroke();
  edG.setLineDash([]);
  edG.fillStyle='#ffd34d'; edG.beginPath(); edG.arc(HEADW-14,my,7,0,7); edG.fill();
}
setInterval(()=>{ if(editorOpen) drawEdPreview(); }, 50);

edName.oninput=()=>{ charData[edChar].name=edName.value||ROSTER.find(r=>r.id===edChar).name;
  buildTabs(); saveStore(); };
edZoom.oninput=()=>{ charData[edChar].cal.zoom=parseFloat(edZoom.value); buildHead(edChar); saveStore(); };
edMouth.oninput=()=>{ charData[edChar].cal.mouthFrac=parseFloat(edMouth.value); buildHead(edChar); saveStore(); };
document.getElementById('edUpload').onclick=()=>fileInput.click();
document.getElementById('edTest').onclick=()=>{ edTestSyl=gibberish(ROSTER.find(r=>r.id===edChar).voice,'taunt'); };
document.getElementById('edReset').onclick=()=>{
  const d=charData[edChar];
  d.photo=null; d.photoURL=null; d.cal=defaultCal();
  d.name=ROSTER.find(r=>r.id===edChar).name;
  buildHead(edChar); pickEdChar(edChar); saveStore();
};
document.getElementById('edAdd').onclick=()=>{
  const base=ROSTER.find(c=>c.id===5);
  const id=Math.max(0,...ROSTER.map(c=>c.id))+1;
  const custom={...base,id,name:'דמות חדשה',art:'סגנון חופשי',role:'אורח/ת בסט',
    sp1:'מכה מיוחדת',sp2:'מהלך שני',sup:'פינישר',custom:true,baseId:base.id,
    gear:{...base.gear},voice:{...base.voice},lines:{intro:['רגע, אני נכנס/ת לפריים'],win:['זה נכנס לגרסה הסופית'],fin:['קאט!']}};
  ROSTER.push(custom); SPECIALS[id]=SPECIALS[base.id];
  charData[id]={name:custom.name,cal:defaultCal(),photo:null,photoURL:null};
  buildHead(id); pickEdChar(id); saveStore();
};
fileInput.onchange=()=>{ if(fileInput.files[0]) loadPhotoFile(fileInput.files[0], edChar); fileInput.value=''; };

function loadPhotoFile(file, id){
  const fr=new FileReader();
  fr.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const mx=800, sc=Math.min(1, mx/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      const url=c.toDataURL('image/jpeg',0.85);
      const d=charData[id];
      d.photoURL=url; d.cal.zoom=1; d.cal.ox=0; d.cal.oy=0;
      const img2=new Image();
      img2.onload=()=>{ d.photo=img2; buildHead(id); drawEdPreview(); saveStore(); };
      img2.src=url;
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}
edPrev.addEventListener('pointerdown',e=>{
  const r=edPrev.getBoundingClientRect();
  const y=(e.clientY-r.top)*(HEADH/r.height);
  const d=charData[edChar];
  const my=d.cal.mouthFrac*HEADH*0.94 + (HEADH-4-HEADH*0.94);
  edMouthDrag = Math.abs(y-my)<16;
  edDragging=!edMouthDrag;
  edLastX=e.clientX; edLastY=e.clientY;
  edPrev.classList.add('drag'); edPrev.setPointerCapture(e.pointerId);
});
edPrev.addEventListener('pointermove',e=>{
  if(!edDragging&&!edMouthDrag) return;
  const r=edPrev.getBoundingClientRect();
  const d=charData[edChar];
  if(edMouthDrag){
    const y=(e.clientY-r.top)*(HEADH/r.height);
    const frac=((y-(HEADH-4-HEADH*0.94))/0.94)/HEADH;
    d.cal.mouthFrac=clamp(frac,0.40,0.88); edMouth.value=d.cal.mouthFrac;
  } else {
    d.cal.ox+=(e.clientX-edLastX)*(HEADW/r.width);
    d.cal.oy+=(e.clientY-edLastY)*(HEADH/r.height);
    edLastX=e.clientX; edLastY=e.clientY;
  }
  buildHead(edChar);
});
addEventListener('pointerup',()=>{ if(edDragging||edMouthDrag) saveStore();
  edDragging=false; edMouthDrag=false; edPrev.classList.remove('drag'); });
edPrev.addEventListener('wheel',e=>{
  e.preventDefault();
  const d=charData[edChar];
  d.cal.zoom=clamp(d.cal.zoom*(e.deltaY<0?1.06:0.94),0.4,3.5);
  edZoom.value=d.cal.zoom; buildHead(edChar);
},{passive:false});
const edBox=document.getElementById('edPreviewBox');
for(const ev of ['dragenter','dragover']) edBox.addEventListener(ev,e=>{
  e.preventDefault(); edBox.classList.add('over'); });
for(const ev of ['dragleave','drop']) edBox.addEventListener(ev,e=>{
  e.preventDefault(); edBox.classList.remove('over'); });
edBox.addEventListener('drop',e=>{
  const f=[...e.dataTransfer.files].find(f=>f.type.startsWith('image/'));
  if(f) loadPhotoFile(f, edChar);
});
document.getElementById('edExport').onclick=()=>{
  const out={};
  for(const c of ROSTER){ const d=charData[c.id];
    out[c.id]={name:d.name, cal:d.cal, photo:d.photoURL||null}; }
  out.custom=ROSTER.filter(c=>c.custom);
  const blob=new Blob([JSON.stringify(out)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='videofight-characters.json'; a.click();
};
document.getElementById('edImport').onclick=()=>importInput.click();
importInput.onchange=()=>{
  const f=importInput.files[0]; if(!f) return;
  const fr=new FileReader();
  fr.onload=()=>{ try{ applyStore(JSON.parse(fr.result)); saveStore(); pickEdChar(edChar); }
                  catch(e){ alert('קובץ לא תקין'); } };
  fr.readAsText(f); importInput.value='';
};

/* =========================================================================
   PWA + BOOT
   ========================================================================= */
try{
  if('serviceWorker' in navigator && location.protocol==='https:'){
    let refreshWhenSafe=false;
    const offerUpdate=()=>{
      refreshWhenSafe=true;
      if(['TITLE','MODE','DIFF','STAGE','SELECT','MATCH_END'].includes(state)){
        announce('יש גרסה חדשה · רעננו כשנוח לכם');
      }
    };
    navigator.serviceWorker.addEventListener('controllerchange',offerUpdate);
    navigator.serviceWorker.register('./sw.js?v='+encodeURIComponent(window.VIDEO_FIGHT_VERSION))
      .then(reg=>{ if(reg.waiting) offerUpdate(); reg.addEventListener('updatefound',()=>{
        const worker=reg.installing;
        if(worker) worker.addEventListener('statechange',()=>{ if(worker.state==='installed'&&navigator.serviceWorker.controller) offerUpdate(); });
      }); }).catch(()=>{});
    window.addEventListener('vf-safe-reload',()=>{ if(refreshWhenSafe) location.reload(); });
  }
}catch(e){}

function applyStore(st){
  if(Array.isArray(st&&st.custom)){
    for(const saved of st.custom){
      if(!Number.isInteger(saved.id)||ROSTER.some(c=>c.id===saved.id)) continue;
      const base=ROSTER.find(c=>c.id===saved.baseId)||ROSTER.find(c=>c.id===5);
      const custom={...base,...saved,custom:true,gear:{...base.gear,...saved.gear},voice:{...base.voice,...saved.voice}};
      ROSTER.push(custom); SPECIALS[custom.id]=SPECIALS[base.id];
    }
  }
  for(const c of ROSTER){
    const d=charData[c.id] || (charData[c.id]={});
    const s=(st&&st[c.id])||{};
    const baked=BAKED[c.id]||{};
    d.name = s.name || baked.name || c.name;
    d.cal  = s.cal  || (baked.cal?{...baked.cal}:defaultCal());
    const url = s.photo || baked.photo || null;
    d.photoURL=url; d.photo=null;
    if(url){
      const img=new Image();
      img.onload=()=>{ d.photo=img; buildHead(c.id); };
      img.src=url;
    }
    buildHead(c.id);
  }
}
applyStore(loadStore());
if(TOUCH) modeSel=0;

window.__vf = {
  get state(){return state;}, get fighters(){return fighters;},
  get projectiles(){return projectiles;}, get fx(){return fx;},
  setState, ROSTER, charData, keys, onKeyPress, STAGE_LIST,
  startMove:(slot,key)=>startMove(fighters[slot],key),
  forcePick(a,b,stage,m){ mode=m||'2P'; if(stage!==undefined) stageSel=stage;
    picked=[a,b]; startMatch(); },
  skipToFight(){ if(state==='VS') startKeyIn(); },
  /* headless stepping — the browser pauses rAF for hidden tabs */
  tick(n){ for(let i=0;i<(n||1);i++) update(); render(); return state; },
};
requestAnimationFrame(frame);
