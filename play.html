<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="וידאו פייט">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>וידאו פייט</title>
<style>
  html,body{margin:0;padding:0;background:#07070d;height:100%;overflow:hidden;
    font-family:-apple-system,"Segoe UI",Arial,sans-serif;
    overscroll-behavior:none;-webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas#game{background:#000;max-width:100vw;max-height:100vh;max-height:100dvh;
    aspect-ratio:16/9;touch-action:none;
    box-shadow:0 0 90px rgba(255,60,120,.22);border-radius:6px;}
  /* ---------- character editor ---------- */
  #editor{position:fixed;inset:0;background:rgba(8,8,14,.93);z-index:20;display:none;
    color:#eee;direction:rtl;}
  #editor.open{display:flex;align-items:center;justify-content:center;}
  #edPanel{background:#16161f;border:1px solid #33334a;border-radius:14px;padding:18px 22px;
    width:min(860px,94vw);max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6);}
  #edPanel h2{margin:0 0 4px;font-size:22px;color:#ffd34d;}
  #edPanel .sub{color:#9aa;font-size:13px;margin-bottom:12px;}
  #edTabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  #edTabs button{background:#232332;color:#ddd;border:1px solid #3a3a55;border-radius:8px;
    padding:7px 12px;cursor:pointer;font-size:14px;}
  #edTabs button.on{background:#ffd34d;color:#222;font-weight:700;border-color:#ffd34d;}
  #edBody{display:flex;gap:22px;flex-wrap:wrap;}
  #edPreviewBox{position:relative;}
  #edPreview{background:
     repeating-conic-gradient(#20202c 0 25%, #191922 0 50%) 0 0/24px 24px;
     border-radius:10px;cursor:grab;touch-action:none;}
  #edPreview.drag{cursor:grabbing;}
  #edHint{font-size:12px;color:#8b8ba0;margin-top:6px;max-width:300px;}
  #edControls{flex:1;min-width:260px;display:flex;flex-direction:column;gap:12px;}
  #edControls label{font-size:13px;color:#bbc;display:block;margin-bottom:4px;}
  #edControls input[type=range]{width:100%;}
  #edControls input[type=text]{width:100%;box-sizing:border-box;background:#0f0f16;color:#fff;
    border:1px solid #3a3a55;border-radius:8px;padding:8px 10px;font-size:15px;}
  .edBtn{background:#2a2a3d;color:#eee;border:1px solid #44446a;border-radius:8px;
    padding:9px 14px;cursor:pointer;font-size:14px;}
  .edBtn.primary{background:#ffd34d;color:#1c1c1c;font-weight:700;border-color:#ffd34d;}
  .edBtn.warn{background:#3d2a2a;border-color:#6a4444;}
  #edBtnRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
  #dropNote{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    text-align:center;color:#fff;background:rgba(255,211,77,.25);border:3px dashed #ffd34d;
    border-radius:10px;font-weight:700;pointer-events:none;opacity:0;transition:opacity .15s;}
  #edPreviewBox.over #dropNote{opacity:1;}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="720"></canvas></div>

<div id="editor">
  <div id="edPanel">
    <h2>עריכת דמויות</h2>
    <div class="sub">מעלים תמונה לכל דמות, גוררים כדי למקם, ומכוונים את קו הפה — שם הראש ייחתך לשניים כשהדמות מדברת. הכל נשמר אוטומטית בדפדפן.</div>
    <div id="edTabs"></div>
    <div id="edBody">
      <div id="edPreviewBox">
        <canvas id="edPreview" width="300" height="360"></canvas>
        <div id="dropNote">שחרר את התמונה כאן</div>
        <div id="edHint">גרירה = הזזת התמונה · גלגלת = זום · אפשר גם לגרור קובץ תמונה ישר לכאן. הקו הצהוב הוא קו הפה.</div>
      </div>
      <div id="edControls">
        <div>
          <label>שם הדמות</label>
          <input type="text" id="edName" maxlength="14">
        </div>
        <div>
          <label>זום</label>
          <input type="range" id="edZoom" min="0.4" max="3.5" step="0.01" value="1">
        </div>
        <div>
          <label>גובה קו הפה</label>
          <input type="range" id="edMouth" min="0.40" max="0.88" step="0.005" value="0.66">
        </div>
        <div id="edBtnRow">
          <button class="edBtn primary" id="edUpload">📷 בחר תמונה…</button>
          <button class="edBtn" id="edTest">🗣️ בדיקת דיבור</button>
          <button class="edBtn warn" id="edReset">איפוס דמות</button>
        </div>
        <div id="edBtnRow">
          <button class="edBtn" id="edExport">⬇️ ייצוא דמויות</button>
          <button class="edBtn" id="edImport">⬆️ ייבוא דמויות</button>
          <button class="edBtn" id="edAdd">➕ הוסף דמות</button>
          <button class="edBtn primary" id="edClose">סגור וחזור למשחק</button>
        </div>
      </div>
    </div>
  </div>
</div>
<input type="file" id="fileInput" accept="image/*" hidden>
<input type="file" id="importInput" accept="application/json" hidden>

window.onerror = function(msg, srcUrl, line){
  try{
    const g = document.getElementById('game').getContext('2d');
    g.setTransform(1,0,0,1,0,0);
    g.fillStyle='#2a0a12'; g.fillRect(0,0,W,H);
    g.fillStyle='#ffd34d'; g.font='900 44px Arial'; g.textAlign='center';
    g.fillText('אופס, המשחק נתקל בשגיאה', W/2, 300);
    g.fillStyle='#fff'; g.font='20px Arial';
    g.fillText(String(msg).slice(0,90), W/2, 360);
    g.fillText('שורה ' + line + ' — שלחו צילום מסך לתומר', W/2, 400);
  }catch(e){}
};

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=(t)=>t<0?0:t>1?1:t*t*(3-2*t);
const rnd=(a)=>a[Math.floor(Math.random()*a.length)];
function rr(g,x,y,w,h,r){ g.beginPath(); g.roundRect(x,y,w,h,r); }

/* ------------------- per-character runtime data ------------------------- */
const charData = {};
function defaultCal(){ return {ox:0, oy:0, zoom:1, mouthFrac:0.66}; }
function loadStore(){
  try{ return JSON.parse(localStorage.getItem('vf_chars_v3')||'{}'); }catch(e){ return {}; }
}
function saveStore(){
  try{
    const out={};
    for(const c of ROSTER){
      const d=charData[c.id];
      out[c.id]={ name:d.name, cal:d.cal, photo:d.photoURL||null };
    }
    out.custom=ROSTER.filter(c=>c.custom).map(c=>({
      id:c.id,name:c.name,art:c.art,style:c.style,role:c.role,voice:c.voice,
      sp1:c.sp1,sp2:c.sp2,sup:c.sup,gear:c.gear,spd:c.spd,jump:c.jump,dmg:c.dmg,weight:c.weight,
      lines:c.lines,baseId:c.baseId||5
    }));
    localStorage.setItem('vf_chars_v3', JSON.stringify(out));
  }catch(e){}
}

/* ======================= head canvas (the split gag) ==================== */
function headPath(g){
  g.beginPath();
  g.ellipse(HEADW/2, HEADH/2+6, 128, 164, 0, 0, Math.PI*2);
}
function buildHead(id){
  const d = charData[id];
  const hc = d.headCanvas || (d.headCanvas = document.createElement('canvas'));
  hc.width = HEADW; hc.height = HEADH;
  const g = hc.getContext('2d');
  g.clearRect(0,0,HEADW,HEADH);
  g.save();
  headPath(g); g.clip();
  if (d.photo && d.photo.complete && d.photo.naturalWidth){
    const iw=d.photo.naturalWidth, ih=d.photo.naturalHeight;
    const base = Math.max(HEADW/iw, HEADH/ih) * d.cal.zoom;
    const dw=iw*base, dh=ih*base;
    g.drawImage(d.photo, HEADW/2-dw/2 + d.cal.ox, HEADH/2-dh/2 + d.cal.oy, dw, dh);
  } else {
    g.fillStyle='#8a7f74'; g.fillRect(0,0,HEADW,HEADH);
    g.fillStyle='rgba(255,255,255,.5)'; g.font='700 34px Arial'; g.textAlign='center';
    g.fillText('אין תמונה', HEADW/2, HEADH/2);
  }
  g.restore();
  headPath(g);
  g.lineWidth = 7; g.strokeStyle = '#ffffff'; g.stroke();
  g.lineWidth = 2.5; g.strokeStyle = 'rgba(0,0,0,.25)'; g.stroke();
}

/* ============================ audio engine ============================== */
let AC=null, muted=false, masterGain=null, sfxGain=null, musicGain=null;
function audio(){
  if(!AC){
    try{
      AC = new (window.AudioContext||window.webkitAudioContext)();
      masterGain = AC.createGain(); masterGain.gain.value=0.9;
      masterGain.connect(AC.destination);
      sfxGain = AC.createGain(); sfxGain.gain.value=1.0; sfxGain.connect(masterGain);
      musicGain = AC.createGain(); musicGain.gain.value=0.42; musicGain.connect(masterGain);
    }catch(e){ AC=null; }
  }
  if(AC && AC.state==='suspended') AC.resume();
  return AC;
}
function env(g,t0,a,peak,d){
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(peak,t0+a);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+a+d);
}
function noiseBuf(ac,len){
  const b=ac.createBuffer(1,Math.max(1,Math.floor(ac.sampleRate*len)),ac.sampleRate);
  const d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  return b;
}

/* --- gibberish talking: drives the head-split mouth --------------------- */
function gibberish(voice, kind){
  const ac=audio(); if(!ac||muted) return fakeSyllables(kind);
  const t0=ac.currentTime+0.02;
  const cfg={ taunt:{n:6+Math.floor(Math.random()*4), gap:0.15, dur:0.13, up:0},
              win:{n:8, gap:0.13, dur:0.12, up:0.4},
              hurt:{n:2, gap:0.09, dur:0.09, up:1.6},
              attack:{n:1, gap:0.1, dur:0.16, up:0.8},
              kiai:{n:1, gap:0.1, dur:0.3, up:1.2},
              ko:{n:4, gap:0.22, dur:0.3, up:-0.5} }[kind]||{n:5,gap:0.14,dur:0.12,up:0};
  const syl=[]; let t=t0;
  for(let i=0;i<cfg.n;i++){
    const o=ac.createOscillator(), g=ac.createGain(), f=ac.createBiquadFilter();
    o.type='sawtooth';
    const base=voice.f*(1+cfg.up*0.25)*(0.88+Math.random()*0.4);
    o.frequency.setValueAtTime(base,t);
    o.frequency.linearRampToValueAtTime(base*(0.8+Math.random()*0.5), t+cfg.dur);
    f.type='lowpass'; f.frequency.value=900+Math.random()*500; f.Q.value=4+Math.random()*4;
    o.connect(f); f.connect(g); g.connect(sfxGain);
    env(g,t,0.015,0.17,cfg.dur);
    o.start(t); o.stop(t+cfg.dur+0.1);
    syl.push({t0:(t-ac.currentTime)*1000+performance.now(), d:cfg.dur*1000});
    t+=cfg.gap*(0.7+Math.random()*0.7)/(voice.rate||1);
  }
  return syl;
}
function fakeSyllables(kind){
  const n={taunt:7,win:8,hurt:2,attack:1,kiai:1,ko:4}[kind]||5, syl=[];
  let t=performance.now();
  for(let i=0;i<n;i++){ syl.push({t0:t,d:120}); t+=150+Math.random()*90; }
  return syl;
}

/* ------------------------------- SFX ----------------------------------- */
function sfx(name, opt){
  const ac=audio(); if(!ac||muted) return;
  const t=ac.currentTime, out=sfxGain;
  const tone=(type,f0,f1,dur,peak,dl)=>{
    const o=ac.createOscillator(); o.type=type;
    o.frequency.setValueAtTime(f0,t+(dl||0));
    if(f1) o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+(dl||0)+dur);
    const g=ac.createGain(); env(g,t+(dl||0),0.005,peak,dur);
    o.connect(g); g.connect(out); o.start(t+(dl||0)); o.stop(t+(dl||0)+dur+0.1);
  };
  const noise=(dur,peak,type,freq,dl)=>{
    const s=ac.createBufferSource(); s.buffer=noiseBuf(ac,dur+0.02);
    const f=ac.createBiquadFilter(); f.type=type||'lowpass'; f.frequency.value=freq||1000;
    const g=ac.createGain(); env(g,t+(dl||0),0.004,peak,dur);
    s.connect(f); f.connect(g); g.connect(out); s.start(t+(dl||0));
  };
  switch(name){
    case 'whoosh': noise(0.16,0.13,'bandpass',1400); break;
    case 'whoosh2': noise(0.22,0.16,'bandpass',800); break;
    case 'hitL': tone('sine',260,80,0.1,0.45); noise(0.06,0.22,'lowpass',1800); break;
    case 'hitH': tone('sine',180,50,0.16,0.6); noise(0.1,0.3,'lowpass',1200);
                 tone('square',120,60,0.1,0.18); break;
    case 'block': tone('square',1800,1500,0.06,0.1); noise(0.05,0.12,'highpass',3000); break;
    case 'throw': tone('triangle',420,900,0.18,0.13); break;
    case 'land': tone('sine',140,60,0.09,0.25); break;
    case 'dash': noise(0.14,0.12,'highpass',1200); break;
    case 'ko': tone('sine',120,30,0.55,0.8); noise(0.4,0.4,'lowpass',500); break;
    case 'bark': tone('square',650,420,0.07,0.16); tone('square',600,380,0.07,0.16,0.14); break;
    case 'ring': for(let b=0;b<2;b++) for(let i=0;i<5;i++)
                   tone('square',1280,null,0.05,0.07,b*0.5+i*0.055); break;
    case 'splat': tone('sine',220,45,0.18,0.6); noise(0.14,0.25,'lowpass',900); break;
    case 'flash': noise(0.22,0.26,'highpass',2500); tone('sine',2600,null,0.3,0.1); break;
    case 'clap': noise(0.05,0.42,'highpass',900); tone('square',880,null,0.06,0.14); break;
    case 'select': tone('square',520,null,0.08,0.1); break;
    case 'confirm': tone('square',520,null,0.1,0.12); tone('square',780,null,0.12,0.12,0.09); break;
    case 'tick': tone('square',1100,null,0.05,0.06); break;
    case 'meter': tone('square',900,1600,0.2,0.09); break;
    case 'super': tone('sawtooth',110,880,0.5,0.22); noise(0.5,0.2,'bandpass',700); break;
    case 'zap': tone('sawtooth',1400,200,0.3,0.18); break;
    case 'boing': tone('sine',180,760,0.16,0.25); tone('sine',760,180,0.16,0.2,0.16); break;
    case 'pop': tone('sine',700,180,0.09,0.3); break;
    case 'siren': tone('sawtooth',500,1200,0.4,0.12); tone('sawtooth',1200,500,0.4,0.12,0.4); break;
    case 'key': tone('square',300,1500,0.35,0.1); noise(0.35,0.1,'bandpass',1800); break;
    case 'stars': for(let i=0;i<5;i++) tone('sine',900+i*180,null,0.12,0.06,i*0.07); break;
    case 'explode': tone('sine',90,25,0.7,0.75); noise(0.7,0.5,'lowpass',700);
                    noise(0.35,0.3,'highpass',1500); break;
  }
}
function announce(text){
  try{
    if(muted || !window.speechSynthesis) return;
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=0.95; u.pitch=0.55; u.volume=1;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

const NOTE = (n)=>{ // 'C4' 'A#3' -> Hz
  const m={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
  const s=n[0].toUpperCase(); let i=1, semi=m[s];
  if(n[1]==='#'){ semi++; i++; } else if(n[1]==='b'){ semi--; i++; }
  const oct=parseInt(n.slice(i),10);
  return 440*Math.pow(2,(semi-9)/12+(oct-4));
};

const MUSIC = { name:null, timer:null, step:0, nextT:0 };
function musicPlay(name){
  const ac=audio();
  if(!ac || MUSIC.name===name) return;
  musicStop();
  if(!TRACKS[name]) return;
  MUSIC.name=name; MUSIC.step=0; MUSIC.nextT=ac.currentTime+0.08;
  MUSIC.timer=setInterval(musicTick, 25);
}
function musicStop(){
  if(MUSIC.timer){ clearInterval(MUSIC.timer); MUSIC.timer=null; }
  MUSIC.name=null;
}
function musicTick(){
  const ac=AC; if(!ac||!MUSIC.name) return;
  const T=TRACKS[MUSIC.name];
  const stepDur=60/T.bpm/4;              // sixteenth notes
  while(MUSIC.nextT < ac.currentTime+0.12){
    const t=MUSIC.nextT, i=MUSIC.step%16;
    if(!muted){
      const b=T.bass[i];
      if(b){
        const o=ac.createOscillator(); o.type='square';
        o.frequency.value=NOTE(b);
        const g=ac.createGain(); env(g,t,0.005,0.30,stepDur*1.7);
        const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=760;
        o.connect(f); f.connect(g); g.connect(musicGain);
        o.start(t); o.stop(t+stepDur*2.2);
      }
      const l=T.lead[i];
      if(l){
        const o=ac.createOscillator(); o.type=T.sw;
        o.frequency.value=NOTE(l);
        const g=ac.createGain(); env(g,t,0.004,0.13,stepDur*1.25);
        o.connect(g); g.connect(musicGain);
        o.start(t); o.stop(t+stepDur*1.8);
        // little octave sparkle
        const o2=ac.createOscillator(); o2.type='square';
        o2.frequency.value=NOTE(l)*2;
        const g2=ac.createGain(); env(g2,t,0.004,0.045,stepDur*0.8);
        o2.connect(g2); g2.connect(musicGain);
        o2.start(t); o2.stop(t+stepDur*1.2);
      }
      const d=T.drum[i];
      if(d==='k'){
        const o=ac.createOscillator(); o.type='sine';
        o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(48,t+0.1);
        const g=ac.createGain(); env(g,t,0.004,0.45,0.1);
        o.connect(g); g.connect(musicGain); o.start(t); o.stop(t+0.2);
      } else if(d==='s'){
        const s=ac.createBufferSource(); s.buffer=noiseBuf(ac,0.09);
        const f=ac.createBiquadFilter(); f.type='highpass'; f.frequency.value=1400;
        const g=ac.createGain(); env(g,t,0.003,0.2,0.08);
        s.connect(f); f.connect(g); g.connect(musicGain); s.start(t);
      } else if(d==='h'){
        const s=ac.createBufferSource(); s.buffer=noiseBuf(ac,0.04);
        const f=ac.createBiquadFilter(); f.type='highpass'; f.frequency.value=6000;
        const g=ac.createGain(); env(g,t,0.002,0.07,0.03);
        s.connect(f); f.connect(g); g.connect(musicGain); s.start(t);
      }
    }
    MUSIC.nextT += stepDur; MUSIC.step++;
  }
}

/* =========================================================================
   SKELETON + ANIMATION
   A pose is a set of joint angles. 0deg = limb hanging straight down,
   positive angles swing toward the direction the fighter faces.
   ========================================================================= */
const P = (o)=>Object.assign({
  px:0, py:0,          // pelvis offset
  lean:0,              // torso lean (deg)
  head:0,              // head tilt relative to torso
  ba:[16,20], fa:[-14,18],   // back arm / front arm  [shoulder, elbow]
  bl:[10,6],  fl:[-10,6],    // back leg / front leg  [hip, knee]
  rot:0,               // whole-body rotation about the hips
  sq:0                 // squash (crouch/impact), 0..1
}, o||{});

function mixA(a,b,t){ return [lerp(a[0],b[0],t), lerp(a[1],b[1],t)]; }
function mixPose(a,b,t){
  return { px:lerp(a.px,b.px,t), py:lerp(a.py,b.py,t), lean:lerp(a.lean,b.lean,t),
           head:lerp(a.head,b.head,t), ba:mixA(a.ba,b.ba,t), fa:mixA(a.fa,b.fa,t),
           bl:mixA(a.bl,b.bl,t), fl:mixA(a.fl,b.fl,t),
           rot:lerp(a.rot,b.rot,t), sq:lerp(a.sq,b.sq,t) };
}
/* keys = [[frame, pose], ...] ; t in frames */
function sample(keys, t, loop){
  if(keys.length===1) return keys[0][1];
  const last=keys[keys.length-1][0];
  if(loop) t = t % last;
  if(t<=keys[0][0]) return keys[0][1];
  if(t>=last) return keys[keys.length-1][1];
  for(let i=0;i<keys.length-1;i++){
    const [t0,p0]=keys[i], [t1,p1]=keys[i+1];
    if(t>=t0 && t<=t1){
      const u=(t1===t0)?0:(t-t0)/(t1-t0);
      return mixPose(p0,p1,ease(u));
    }
  }
  return keys[keys.length-1][1];
}

/* ------------------------- body proportions ---------------------------- */
function metrics(f){
  const w=f.char.weight;
  const bulk = 1 + (w-1)*1.15;
  return {
    pelvisY:-132, torso:122, neck:10,
    ua:52, fa:48, th:72, sh:68,
    shW:47*bulk, hipW:31*bulk,
    limb:21*bulk, arm:15*bulk,
    belly: w>1.3 ? 1 : 0,
    bulk
  };
}
const EDGE='rgba(18,12,24,.85)';
function joint(x,y,ang,len){
  const a=ang*Math.PI/180;
  return [x+Math.sin(a)*len, y+Math.cos(a)*len];
}
/* one limb segment: an outlined capsule (clean, no seams) */
function limb(g,x0,y0,x1,y1,w0,w1,col,edge){
  const w=(w0+w1)/2;
  g.lineCap='round'; g.lineJoin='round';
  if(edge!==false){
    g.strokeStyle=EDGE; g.lineWidth=w+7;
    g.beginPath(); g.moveTo(x0,y0); g.lineTo(x1,y1); g.stroke();
  }
  g.strokeStyle=col; g.lineWidth=w;
  g.beginPath(); g.moveTo(x0,y0); g.lineTo(x1,y1); g.stroke();
  // soft top-light along the segment
  g.strokeStyle='rgba(255,255,255,.14)'; g.lineWidth=w*0.34;
  g.beginPath(); g.moveTo(x0,y0-w*0.22); g.lineTo(x1,y1-w*0.22); g.stroke();
}

function drawBody(g, f, p){
  const M=metrics(f), G=f.char.gear;
  const shade='rgba(0,0,0,.22)';
  g.save();
  g.translate(p.px, p.py + p.sq*10);
  if(p.rot) { g.translate(0, M.pelvisY); g.rotate(p.rot*Math.PI/180); g.translate(0,-M.pelvisY); }

  const pel=[0, M.pelvisY + p.sq*16];
  const chest=joint(pel[0],pel[1], 180-p.lean, M.torso);   // up = 180deg
  const headA=joint(chest[0],chest[1], 180-p.lean-p.head, M.neck);

  const sk=G.skin, cloth=G.gi, cloth2=G.gi2, pants=G.pants;
  const sleeve  = G.top==='tank'||G.top==='mawashi' ? sk : shadeCol(cloth,-16);
  const sleeveB = G.top==='tank'||G.top==='mawashi' ? shadeCol(sk,-22) : shadeCol(cloth,-40);
  const legWear = G.top==='mawashi' ? sk : pants;

  // ---- back leg
  let hip=[pel[0]-M.hipW*0.5, pel[1]];
  let knee=joint(hip[0],hip[1], p.bl[0], M.th*(1-p.sq*0.12));
  let foot=joint(knee[0],knee[1], p.bl[0]+p.bl[1], M.sh*(1-p.sq*0.12));
  limb(g,hip[0],hip[1],knee[0],knee[1], M.limb*1.32, M.limb*1.0, shadeCol(legWear,-22), EDGE);
  limb(g,knee[0],knee[1],foot[0],foot[1], M.limb*1.0, M.limb*0.72, shadeCol(legWear,-22), EDGE);
  drawFoot(g,foot,knee,M,shadeCol('#f2f2f2',-30));
  // ---- back arm
  let sho=[chest[0]-M.shW*0.55, chest[1]+6];
  let elb=joint(sho[0],sho[1], p.ba[0]-p.lean, M.ua);
  let hand=joint(elb[0],elb[1], p.ba[0]+p.ba[1]-p.lean, M.fa);
  limb(g,sho[0],sho[1],elb[0],elb[1], M.arm*1.25, M.arm, sleeveB, EDGE);
  limb(g,elb[0],elb[1],hand[0],hand[1], M.arm, M.arm*0.82, shadeCol(sk,-18), EDGE);
  fist(g,hand,M.arm*0.78, shadeCol(sk,-18));
  const backHand=hand;

  // ---- neck (drawn under the torso so the collar overlaps it)
  const nk=joint(chest[0],chest[1], 180-p.lean-p.head, M.neck+16);
  limb(g,chest[0],chest[1]+6,nk[0],nk[1], M.arm*1.55, M.arm*1.45, shadeCol(sk,-30));
  // ---- torso
  drawTorso(g,f,pel,chest,M,p);
  // shoulder caps so the arms merge into the body
  for(const s of [-1,1]){
    const sx=chest[0]+s*M.shW*0.52, sy=chest[1]+8;
    g.fillStyle= s<0? shadeCol(sleeve,-22): sleeve;
    g.strokeStyle=EDGE; g.lineWidth=3;
    g.beginPath(); g.arc(sx,sy,M.arm*0.86,0,7); g.fill(); g.stroke();
  }

  // ---- front leg
  hip=[pel[0]+M.hipW*0.5, pel[1]];
  knee=joint(hip[0],hip[1], p.fl[0], M.th*(1-p.sq*0.12));
  foot=joint(knee[0],knee[1], p.fl[0]+p.fl[1], M.sh*(1-p.sq*0.12));
  limb(g,hip[0],hip[1],knee[0],knee[1], M.limb*1.38, M.limb*1.02, legWear, EDGE);
  limb(g,knee[0],knee[1],foot[0],foot[1], M.limb*1.02, M.limb*0.74, legWear, EDGE);
  drawFoot(g,foot,knee,M,'#f6f6f6');
  const frontFoot=foot;

  // ---- head (the photo, split at the mouth line)
  g.save();
  g.translate(headA[0], headA[1]+26);
  g.rotate((-p.lean-p.head)*Math.PI/180);
  drawHeadSplit(g, f, 0.40*(1+(M.bulk-1)*0.20));
  drawHeadGear(g, f, M);
  g.restore();

  // ---- front arm (over the torso)
  sho=[chest[0]+M.shW*0.5, chest[1]+6];
  elb=joint(sho[0],sho[1], p.fa[0]-p.lean, M.ua);
  hand=joint(elb[0],elb[1], p.fa[0]+p.fa[1]-p.lean, M.fa);
  limb(g,sho[0],sho[1],elb[0],elb[1], M.arm*1.3, M.arm*1.04, sleeve, EDGE);
  limb(g,elb[0],elb[1],hand[0],hand[1], M.arm*1.04, M.arm*0.84, sk, EDGE);
  fist(g,hand,M.arm*0.84,sk);

  f._hands={front:hand, back:backHand, foot:frontFoot, chest, pel};
  g.restore();
}
function shadeCol(hex,amt){
  if(hex[0]!=='#') return hex;
  let r=parseInt(hex.slice(1,3),16), gg=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  r=clamp(r+amt,0,255); gg=clamp(gg+amt,0,255); b=clamp(b+amt,0,255);
  return `rgb(${r},${gg},${b})`;
}
function fist(g,pt,r,col){
  g.fillStyle=col; g.beginPath(); g.arc(pt[0],pt[1],r,0,7); g.fill();
  g.strokeStyle=EDGE; g.lineWidth=3; g.stroke();
}
function drawFoot(g,foot,knee,M,col){
  const a=Math.atan2(foot[0]-knee[0], foot[1]-knee[1]);
  g.save(); g.translate(foot[0],foot[1]); g.rotate(-a*0.35);
  g.fillStyle=col;
  rr(g,-M.limb*0.5, -M.limb*0.30, M.limb*1.7, M.limb*0.72, M.limb*0.30);
  g.fill(); g.strokeStyle=EDGE; g.lineWidth=3; g.stroke();
  g.restore();
}
function drawTorso(g,f,pel,chest,M,p){
  const G=f.char.gear;
  /* local frame: origin at the pelvis, the torso is built along -y (up) */
  const ang=Math.atan2(chest[0]-pel[0], -(chest[1]-pel[1]));
  g.save();
  g.translate(pel[0],pel[1]);
  g.rotate(ang);
  const hW=M.shW*1.16, wW=M.hipW*1.12;
  const len=-M.torso;
  const bare = (G.top==='tank'||G.top==='mawashi');
  // torso silhouette: wide shoulders tapering to the waist
  g.beginPath();
  g.moveTo(-wW,0);
  g.bezierCurveTo(-wW-M.belly*30, len*0.42, -hW*0.98, len*0.70, -hW*0.90, len*0.97);
  g.quadraticCurveTo(0, len*1.06, hW*0.90, len*0.97);
  g.bezierCurveTo(hW*0.98, len*0.70, wW+M.belly*34, len*0.42, wW, 0);
  g.closePath();
  const base = bare ? G.skin : G.gi;
  const grd=g.createLinearGradient(-hW,0,hW,0);
  grd.addColorStop(0, shadeCol(base,-30)); grd.addColorStop(0.55, base);
  grd.addColorStop(1, shadeCol(base,12));
  g.fillStyle=grd; g.fill();
  g.strokeStyle=EDGE; g.lineWidth=3; g.stroke();
  if(bare){                                   // pecs + abs so bare torsos read
    g.strokeStyle='rgba(120,70,40,.30)'; g.lineWidth=3;
    g.beginPath(); g.moveTo(0,len*0.72); g.lineTo(0,len*0.34); g.stroke();
    g.beginPath(); g.moveTo(-hW*0.55,len*0.70); g.quadraticCurveTo(0,len*0.60,hW*0.55,len*0.70); g.stroke();
  }
  if(G.top==='gi'||G.top==='dobok'){                 // lapels
    g.strokeStyle=shadeCol(G.gi,-40); g.lineWidth=4;
    g.beginPath(); g.moveTo(-hW*0.55,len); g.lineTo(2,len*0.30); g.lineTo(hW*0.55,len); g.stroke();
    g.fillStyle=G.belt; rr(g,-wW-2,-13,wW*2+4,15,4); g.fill();   // belt
    g.fillStyle=G.belt; rr(g,-4,-13,10,34,4); g.fill();
  } else if(G.top==='silk'){
    g.strokeStyle=G.belt; g.lineWidth=3;
    g.beginPath(); g.moveTo(-hW*0.4,len*0.95); g.lineTo(0,len*0.25); g.stroke();
    for(let i=0;i<4;i++){ g.fillStyle=G.belt;
      g.beginPath(); g.arc(2, len*0.28-i*10, 3.2, 0,7); g.fill(); }
    g.fillStyle=G.belt; rr(g,-wW-2,-11,wW*2+4,12,4); g.fill();
  } else if(G.top==='tank'){
    g.beginPath();                                   // singlet
    g.moveTo(-hW*0.60,len*0.97); g.lineTo(-hW*0.30,len*0.99);
    g.lineTo(-hW*0.34,len*0.62); g.lineTo(-wW*0.98,4);
    g.lineTo(wW*0.98,4); g.lineTo(hW*0.34,len*0.62);
    g.lineTo(hW*0.30,len*0.99); g.lineTo(hW*0.60,len*0.97);
    g.lineTo(hW*0.66,len*0.55); g.lineTo(wW*1.04,6);
    g.lineTo(-wW*1.04,6); g.lineTo(-hW*0.66,len*0.55);
    g.closePath();
    g.fillStyle=G.gi; g.fill(); g.strokeStyle=EDGE; g.lineWidth=3; g.stroke();
    g.fillStyle=G.belt; rr(g,-wW-3,-14,wW*2+6,15,4); g.fill();   // capoeira cord
    g.strokeStyle=EDGE; g.lineWidth=2.5; g.stroke();
  } else if(G.top==='vest'){
    g.fillStyle=shadeCol(G.gi,-30);
    rr(g,-hW*0.95,len*0.98,hW*0.55,-len*0.95,5); g.fill();
    rr(g, hW*0.40,len*0.98,hW*0.55,-len*0.95,5); g.fill();
    for(const py of [len*0.62, len*0.34]){                        // pockets
      g.fillStyle=shadeCol(G.gi,-48); rr(g,-hW*0.9,py,hW*0.5,16,3); g.fill();
      g.fillStyle=shadeCol(G.gi,-48); rr(g, hW*0.44,py,hW*0.5,16,3); g.fill();
    }
    g.fillStyle=G.belt; rr(g,-wW-2,-12,wW*2+4,14,4); g.fill();
  } else if(G.top==='mawashi'){
    g.fillStyle=G.belt;                                            // sumo belt
    rr(g,-wW-4,-24,wW*2+8,30,5); g.fill();
    g.fillStyle=shadeCol(G.belt,-30);
    rr(g,-8,-24,16,42,4); g.fill();
    g.fillStyle='rgba(0,0,0,.13)';                                 // belly shading
    g.beginPath(); g.ellipse(2,len*0.34,wW*0.9,-len*0.30,0,0,7); g.fill();
  }
  if(f.char.gear.bag){                                             // Tomer's sound bag
    g.fillStyle='#26262e'; rr(g,-wW-14,-16,26,30,5); g.fill();
    g.fillStyle='#3d3d48'; rr(g,-wW-11,-11,20,8,2); g.fill();
    g.strokeStyle='#26262e'; g.lineWidth=4;
    g.beginPath(); g.moveTo(-wW-4,-16); g.lineTo(hW*0.5,len*0.85); g.stroke();
  }
  g.restore();
}
function drawHeadGear(g,f,M){
  const G=f.char.gear, s=0.40*(1+(M.bulk-1)*0.20);
  if(G.headphones){                       // Tomer never takes them off
    g.save(); g.scale(s,s);
    g.strokeStyle='#1d1d24'; g.lineWidth=15; g.lineCap='round';
    g.beginPath(); g.arc(HEADW/2, -HEADH*0.52, 132, Math.PI*1.16, Math.PI*1.84); g.stroke();
    for(const dx of [-1,1]){
      g.fillStyle='#23232c';
      g.save(); g.translate(HEADW/2+dx*126, -HEADH*0.47);
      rr(g,-26,-34,52,68,16); g.fill();
      g.fillStyle='#3a3a46'; rr(g,-16,-24,32,48,12); g.fill();
      g.restore();
    }
    g.restore();
  }
  if(G.earpiece){                         // Adi is always on a call
    g.save(); g.scale(s,s);
    g.fillStyle='#e8e8ee';
    g.beginPath(); g.ellipse(HEADW/2+118, -HEADH*0.42, 16, 24, 0.2, 0, 7); g.fill();
    g.fillStyle='#9ad1ff';
    g.beginPath(); g.arc(HEADW/2+118, -HEADH*0.50, 5, 0, 7); g.fill();
    g.restore();
  }
}

/* on-screen pads: movement on the LEFT, attacks on the RIGHT (1P layout) */
function buildPads(){
  const b=[];
  const add=(x,y,s,label,code,type,slot,tag)=>b.push({x:x-s/2,y:y-s/2,w:s,h:s,label,code,type,slot,tag});
  if(mode==='1P'){
    const K=P1KEYS, R=112, cx=160, cy=520;                 // left: movement diamond
    add(cx-R, cy, 96,'◀',K.left,'hold',0);
    add(cx+R, cy, 96,'▶',K.right,'hold',0);
    add(cx, cy-R+6, 96,'⬆',K.up,'tap',0);
    add(cx, cy+R-6, 96,'⬇',K.down,'hold',0);
    const rx=W-150, ry=520;                                 // right: attacks
    add(rx,       ry+52, 100,'👊',K.punch,'tap',0);
    add(rx-116,   ry+30, 100,'🦵',K.kick,'tap',0);
    add(rx-206,   ry-56, 96,'⚡',K.special,'tap',0);
    add(rx-40,    ry-72, 96,'🛡',K.block,'hold',0);
    add(rx-236,   ry+52, 92,'🏃','DASH','tap',0);
    add(rx+16,    ry-160, 86,'🔥','SUPER','tap',0,'super');
  } else {
    const S=80;
    const mk=(slot,ox,dir)=>{
      const K = slot===0?P1KEYS:P2KEYS;
      const cx=ox, cy=560, R=78;
      add(cx-R, cy, S,'◀',K.left,'hold',slot);
      add(cx+R, cy, S,'▶',K.right,'hold',slot);
      add(cx, cy-R+2, S,'⬆',K.up,'tap',slot);
      add(cx, cy+R-4, S,'⬇',K.down,'hold',slot);
      const ax=ox+dir*236;
      add(ax,        cy+30, S,'👊',K.punch,'tap',slot);
      add(ax+dir*84, cy-10, S,'🦵',K.kick,'tap',slot);
      add(ax+dir*24, cy-96, S,'⚡',K.special,'tap',slot);
      add(ax-dir*56, cy-84, S,'🛡',K.block,'hold',slot);
      add(ax+dir*116,cy+62, 74,'🏃','DASH','tap',slot);
      add(ax+dir*104,cy-150,76,'🔥','SUPER','tap',slot,'super');
    };
    mk(0,150,1); mk(1,W-150,-1);
  }
  return b;
}

let triedFS=false;

/* menu hit rects */
const R_MODE=[[W/2-420,150,380,150],[W/2+40,150,380,150]];
const R_BACK=[24,22,116,52];
const PAUSE_BTN=[W/2-128,10,52,52], MUTE_BTN=[W/2+76,10,52,52];
const MB_REMATCH=[W/2-330,624,300,58], MB_CHANGE=[W/2+30,624,300,58];
const ED_BTN=[W/2-250,H-58,500,44];
const SEL_GRID={cols:3,cw:206,ch:236,gx:298,gy:126,gapx:30,gapy:20};

function handleTap(p,id){
  if(state==='TITLE'){ setState('MODE'); sfx('confirm'); return; }
  if(state==='MODE'){
    if(stateT<300) return;
    for(const i of [0,1]) if(inRect(p,R_MODE[i])){ modeSel=i; confirmMode(); return; }
    return;
  }
  if(state==='DIFF'){
    if(stateT<250) return;
    for(let i=0;i<DIFFS.length;i++){
      if(inRect(p,[W/2-460+i*236,250,216,150])){ diffSel=i; confirmDiff(); return; }
    }
    if(inRect(p,R_BACK)){ setState('MODE'); sfx('select'); }
    return;
  }
  if(state==='STAGE'){
    if(stateT<250) return;
    for(let i=0;i<STAGE_LIST.length;i++){
      const r=stageRect(i);
      if(inRect(p,r)){ stageSel=i; confirmStage(); return; }
    }
    if(inRect(p,R_BACK)){ setState(mode==='1P'?'DIFF':'MODE'); sfx('select'); }
    return;
  }
  if(state==='SELECT'){
    if(stateT<300) return;
    if(inRect(p,ED_BTN)){ openEditor(); return; }
    if(inRect(p,R_BACK)){ setState('STAGE'); sfx('select'); return; }
    const G=SEL_GRID;
    for(let i=0;i<ROSTER.length;i++){
      const col=i%G.cols, row=Math.floor(i/G.cols);
      const x=G.gx+col*(G.cw+G.gapx), y=G.gy+row*(G.ch+G.gapy);
      if(inRect(p,[x,y,G.cw,G.ch])){ tapPick(i); return; }
    }
    return;
  }
  if(state==='VS'){ if(stateT>900) startKeyIn(); return; }
  if(state==='FIGHT'){
    if(paused){ paused=false; return; }
    if(inRect(p,PAUSE_BTN)){ paused=true; return; }
    if(inRect(p,MUTE_BTN)){ muted=!muted; return; }
    if(TOUCH){
      for(const b of padBtns){
        if(b.tag==='super' && !superReady(fighters[b.slot])) continue;
        if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){
          if(b.code==='DASH'){ tryDash(fighters[b.slot]); return; }
          if(b.code==='SUPER'){ trySuper(fighters[b.slot]); return; }
          if(b.type==='hold'){ keys[b.code]=true; ptrHeld.set(id,b); }
          else onKeyPress(b.code);
          return;
        }
      }
    }
    return;
  }
  if(state==='ROUND_END'){ onKeyPress('Space'); return; }
  if(state==='MATCH_END'){
    if(stateT<1600) return;
    if(inRect(p,MB_REMATCH)){ onKeyPress('KeyR'); return; }
    if(inRect(p,MB_CHANGE)){ onKeyPress('Space'); return; }
    return;
  }
}
function onKeyPress(code){
  if(code==='KeyM'){ muted=!muted; return; }
  if(code==='KeyP'&&state==='FIGHT'){ paused=!paused; return; }
  if(state==='TITLE'){ setState('MODE'); sfx('confirm'); return; }
  if(state==='MODE'){
    if(['KeyA','ArrowLeft','KeyD','ArrowRight'].includes(code)){ modeSel=1-modeSel; sfx('select'); return; }
    if(code==='Digit1'){ modeSel=0; confirmMode(); return; }
    if(code==='Digit2'){ modeSel=1; confirmMode(); return; }
    if(['KeyF','KeyK','Enter','Space'].includes(code)) confirmMode();
    return;
  }
  if(state==='DIFF'){
    if(['KeyA','ArrowLeft'].includes(code)){ diffSel=(diffSel+DIFFS.length-1)%DIFFS.length; sfx('select'); return; }
    if(['KeyD','ArrowRight'].includes(code)){ diffSel=(diffSel+1)%DIFFS.length; sfx('select'); return; }
    if(['KeyF','KeyK','Enter','Space'].includes(code)) confirmDiff();
    return;
  }
  if(state==='STAGE'){
    const n=STAGE_LIST.length;
    if(['KeyA','ArrowLeft'].includes(code)){ stageSel=(stageSel+n-1)%n; sfx('select'); return; }
    if(['KeyD','ArrowRight'].includes(code)){ stageSel=(stageSel+1)%n; sfx('select'); return; }
    if(['KeyW','ArrowUp'].includes(code)){ stageSel=(stageSel+n-4)%n; sfx('select'); return; }
    if(['KeyS','ArrowDown'].includes(code)){ stageSel=(stageSel+4)%n; sfx('select'); return; }
    if(['KeyF','KeyK','Enter','Space'].includes(code)) confirmStage();
    return;
  }
  if(state==='SELECT'){
    if(code==='KeyE'){ openEditor(); return; }
    for(const [slot,K] of [[0,P1KEYS],[1,P2KEYS]]){
      if(mode==='1P'&&slot===1) continue;
      if(picked[slot]!==null) continue;
      if(code===K.left){ sel[slot]=(sel[slot]+ROSTER.length-1)%ROSTER.length; sfx('select'); }
      if(code===K.right){ sel[slot]=(sel[slot]+1)%ROSTER.length; sfx('select'); }
      if(code===K.up){ sel[slot]=(sel[slot]+ROSTER.length-3)%ROSTER.length; sfx('select'); }
      if(code===K.down){ sel[slot]=(sel[slot]+3)%ROSTER.length; sfx('select'); }
      if(code===K.confirm){ picked[slot]=ROSTER[sel[slot]].id; sfx('confirm');
        gibberish(ROSTER[sel[slot]].voice,'taunt'); }
    }
    afterPickCheck();
    return;
  }
  if(state==='VS'){ if(stateT>900) startKeyIn(); return; }
  if(state==='FIGHT'&&!paused){
    if(freeze>0) return;
    for(const f of fighters){
      if(!f||f.isCPU) continue;
      const K=f.slot===0?P1KEYS:P2KEYS;
      if(code===K.up) tryJump(f);
      else if(code===K.punch){ if(keys[K.kick]&&superReady(f)) trySuper(f); else pressAttack(f,'P'); }
      else if(code===K.kick){ if(keys[K.punch]&&superReady(f)) trySuper(f); else pressAttack(f,'K'); }
      else if(code===K.special) pressSpecial(f);
      else if(code===K.left||code===K.right) noteDirTap(f,code===K.left?-1:1);
    }
    return;
  }
  if(state==='ROUND_END'&&stateT>1500){
    if(wins[0]>=2||wins[1]>=2) return;   // finisher takes over
    round++; startRound(); beginFight();
    return;
  }
  if(state==='MATCH_END'&&stateT>1600){
    if(code==='KeyR'){ startMatch(); }
    else { picked=[null,null]; setState('MODE'); }
    return;
  }
}
/* double-tap a direction = dash */
function noteDirTap(f,dir){
  const now=performance.now();
  if(f.lastTapDir===dir && now-f.lastTapT<260){ tryDash(f,dir); f.lastTapT=0; }
  else { f.lastTapDir=dir; f.lastTapT=now; }
}

function mouthOpen(f){
  const now=performance.now(); let m=0;
  for(const s of f.syllables){
    if(now>=s.t0&&now<=s.t0+s.d){ const p=(now-s.t0)/s.d; m=Math.max(m,Math.sin(p*Math.PI)); }
  }
  if(f.hitstun>0) m=Math.max(m,0.75);
  if(f.dizzy>0) m=Math.max(m,0.45+0.25*Math.sin(now/110));
  if(f.anim==='ko') m=Math.max(m,0.5+0.3*Math.sin(now/90));
  return m;
}
function say(f,kind,text){
  f.syllables=gibberish(f.char.voice,kind);

}
function superReady(f){ return !!f && f.meter>=100; }
function addMeter(f,n){ if(f) f.meter=clamp(f.meter+n,0,100); }

/* ------------------------------ moves ---------------------------------- */
function pressAttack(f,btn){
  if(!canAct(f)) return;
  const K=f.slot===0?P1KEYS:P2KEYS;
  const fwd = f.isCPU ? f.aiFwd : (keys[f.facing>0?K.right:K.left]);
  const down= f.isCPU ? f.aiDown : keys[K.down];
  let key;
  if(btn==='P') key = down? 'lp' : (fwd? 'hp':'lp');
  else          key = down? 'lk' : (fwd? 'hk':'lk');
  if(down && btn==='K') key='lk';
  startMove(f,key);
}
function pressSpecial(f){
  if(!canAct(f)) return;
  const K=f.slot===0?P1KEYS:P2KEYS;
  const down = f.isCPU ? f.aiDown : keys[K.down];
  startMove(f, down?'sp2':'sp1');
}
function trySuper(f){
  if(!f||!canAct(f)||f.meter<100) return;
  f.meter=0; startMove(f,'sup');
}
function tryJump(f){
  if(!f||!f.onGround||f.move||f.hitstun>0||f.dizzy>0||state!=='FIGHT') return;
  const K=f.slot===0?P1KEYS:P2KEYS;
  f.vy=-f.char.jump; f.onGround=false;
  const dir=(f.isCPU?f.aiMove:((keys[K.right]?1:0)+(keys[K.left]?-1:0)));
  f.vx=dir*f.char.spd*0.9;
}
function tryDash(f,dir){
  if(!f||!canAct(f)||!f.onGround) return;
  const K=f.slot===0?P1KEYS:P2KEYS;
  const d = dir || (keys[K.right]?1:keys[K.left]?-1:f.facing);
  f.dashT=13; f.dashDir=d; f.anim='dash'; f.animT=0;
  sfx('dash'); addMeter(f,3);
}
function canAct(f){
  return f && state==='FIGHT' && !paused && freeze<=0 &&
         f.hitstun<=0 && f.dizzy<=0 && f.anim!=='ko' &&
         (!f.move || (f.move.hitLanded && f.move.cancels && f.moveT>f.move.startup));
}
function startMove(f,key){
  const base = SPECIALS[f.char.id] && SPECIALS[f.char.id][key];
  const def  = base || moveDef(f,key);
  if(!def) return;
  if(f.move && f.move.cancels && !f.move.cancels.includes(key) && f.move.hitLanded) return;
  if(f.move && !f.move.hitLanded && f.moveT<f.move.startup+f.move.active) return;
  f.move = Object.assign({}, def, {key, hitLanded:false});
  f.moveT=0; f.hitDone=false; f.hitTick=0;
  f.anim='move';
  if(def.onStart) def.onStart(f);
  if(def.swing) sfx(def.swing);
  if(def.kiai || Math.random()<0.3) say(f, def.kiai?'kiai':'attack');
}

/* -------------------------- hit resolution ----------------------------- */
function hitboxOf(f){
  const m=f.move; if(!m) return null;
  const x0=f.x + f.facing*(30);
  return { x:Math.min(x0, x0+f.facing*m.reach), y:f.y+m.hy-m.hh/2,
           w:Math.abs(m.reach), h:m.hh };
}
function bodyBox(f){
  const w=f.char.weight>1.3?86:66;
  const top = f.crouch? -110 : -230;
  return { x:f.x-w/2, y:f.y+top, w:w, h:-top };
}
function overlap(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }

function resolveAttack(f,foe){
  const m=f.move; if(!m||m.kind!=='attack') return;
  const active = f.moveT>m.startup && f.moveT<=m.startup+m.active;
  if(!active) return;
  if(m.hits>1){
    f.hitTick--;
    if(f.hitTick>0) return;
    f.hitTick=Math.max(2,Math.floor(m.active/m.hits));
  } else if(f.hitDone) return;
  if(overlap(hitboxOf(f), bodyBox(foe)) && foe.anim!=='ko'){
    if(m.hits<=1) f.hitDone=true;
    m.hitLanded=true;
    landHit(foe,f,m);
  }
}
function landHit(victim, attacker, m){
  if(victim.anim==='ko'||state!=='FIGHT') return;
  const away = (attacker.x>victim.x) === (victim.facing===1);
  const guarding = victim.blocking && away && !m.unblockable &&
                   !(m.level==='low' && !victim.crouch) &&
                   !(m.level==='over' && victim.crouch);
  const dmgScale = (attacker.isCPU? DIFFS[diff].dmg : 1) * attacker.char.dmg;
  if(guarding){
    const perfect=victim.blockT<=4;
    victim.hp=Math.max(0,victim.hp-perfect?0:Math.ceil(m.dmg*dmgScale*0.12));
    victim.blockstun=Math.max(victim.blockstun, Math.floor(m.stun*(perfect?0.25:0.55)));
    victim.vx=(victim.x<attacker.x?-1:1)*2.6;
    sfx('block');
    spark(attacker.x+attacker.facing*70, victim.y-150,perfect?'#ffd34d':'#9ad1ff',perfect?14:6,perfect?3:2);
    if(perfect){ hitstop=5; shake=5; impactFlash=5; impactTone='#9ad1ff';
      fx.push({t:'text',x:victim.x,y:victim.y-280,txt:'חסימה מושלמת!',col:'#9ad1ff',size:28,life:38}); }
    addMeter(victim,perfect?8:3); addMeter(attacker,3);
    return;
  }
  const counter=!!(victim.move && victim.move.kind==='attack' && victim.moveT<=victim.move.startup+victim.move.active);
  const airBonus=!victim.onGround && attacker.comboHits>0;
  const dmg=Math.round(m.dmg*dmgScale*(counter?1.22:1)*(airBonus?1.12:1));
  victim.hp=Math.max(0,victim.hp-dmg);
  victim.move=null; victim.anim='hurt'; victim.animT=0;
  victim.hitstun=m.stun+(m.hits>1?2:0)+(counter?9:0)+(airBonus?4:0);
  victim.vx=(victim.x<attacker.x?-1:1)*m.kb*(1/Math.max(0.7,victim.char.weight*0.8));
  victim.vy=m.launch?-14:(victim.onGround?-2.5:-1);
  if(m.launch) victim.onGround=false;
  attacker.comboHits++; attacker.comboT=90;
  addMeter(attacker, m.meter||7); addMeter(victim, Math.ceil((m.meter||7)*0.5));
  sfx(m.hit||'hitL');
  const hx=attacker.x+attacker.facing*(m.reach*0.7), hy=victim.y+m.hy;
  const heavy=m.hit==='hitH'||counter||m.launch;
  spark(hx,hy, heavy?'#ffd34d':'#ffffff', heavy?20:11,heavy?4:3);
  fx.push({t:'impact', x:hx, y:hy, life:heavy?16:12, big:heavy});
  if(counter) fx.push({t:'text',x:hx,y:hy-82,txt:'קונטרה!',col:'#ff8a60',size:32,life:42});
  hitstop = heavy?10:5; impactFlash=heavy?7:3; impactTone=counter?'#ff5e3a':heavy?'#ffd34d':'#ffffff';
  shake=Math.min(24, 7+dmg*(heavy?0.9:0.55));
  if(Math.random()<0.55) say(victim,'hurt');
  // dizzy after a long combo
  victim.dizzyMeter=(victim.dizzyMeter||0)+dmg;
  if(victim.dizzyMeter>52 && victim.hp>0){ victim.dizzyMeter=0; victim.dizzy=110;
    victim.anim='dizzy'; victim.animT=0; sfx('stars'); }
  if(victim.hp<=0) startKO(victim,attacker);
}
function spark(x,y,col,n,scale){
  for(let i=0;i<n;i++)
    fx.push({t:'spark', x, y, vx:(Math.random()-0.5)*11*(scale||1),
      vy:(Math.random()-0.75)*10*(scale||1), life:16+Math.random()*14, col,
      r:2.5+Math.random()*3.6*(scale||1)});
}

/* ------------------------------- KO ------------------------------------ */
function startKO(victim, attacker){
  if(victim.anim==='ko'||state!=='FIGHT') return;
  victim.anim='ko'; victim.animT=0; victim.move=null;
  victim.vy=-12; victim.vx=(victim.x<attacker.x?-1:1)*8; victim.onGround=false;
  sfx('ko'); shake=20; hitstop=14; slowmo=48;
  wins[attacker.slot]++;
  say(victim,'ko');
  koPair={winner:attacker, loser:victim};
  setState('ROUND_END');
  announce('Cut!');
}
function startFinisher(winner, loser){
  finish={phase:0, t:0, winner, loser};
  loser.anim='dizzy'; loser.animT=0; loser.dizzy=99999;
  loser.y=FLOOR; loser.vy=0; loser.vx=0; loser.hp=0;
  winner.anim='idle'; winner.move=null;
  const d=loser.x>winner.x?1:-1;
  winner.facing=d; loser.facing=-d;
  loser.x = clamp(winner.x + d*230, 130, W-130);
  setState('FINISH');
  musicStop(); sfx('stars');
  announce('Finish him');
}

/* =========================================================================
   PER-FRAME FIGHTER UPDATE
   ========================================================================= */
function stepFighter(f, foe){
  f.animT++;
  if(f.comboT>0){ f.comboT--; if(f.comboT<=0) f.comboHits=0; }
  if(f.bubbleT>0){ f.bubbleT-=DT; if(f.bubbleT<=0) f.bubble=null; }

  if(f.anim==='ko'){
    f.vy+=0.9; f.y+=f.vy; f.x+=f.vx*0.55;
    if(f.y>FLOOR){ f.y=FLOOR; f.vy=0; f.vx*=0.8; }
    f.x=clamp(f.x,70,W-70);
    return;
  }
  if(state!=='FIGHT'){ if(foe) f.facing = foe.x>f.x?1:-1; return; }

  if(f.dizzy>0){
    f.dizzy--;
    f.vy+=0.9; f.y=Math.min(FLOOR,f.y+f.vy);
    if(f.y>=FLOOR){ f.y=FLOOR; f.vy=0; f.onGround=true; f.vx*=0.8; }
    f.x=clamp(f.x+f.vx,70,W-70);
    if(f.dizzy<=0){ f.anim='idle'; f.animT=0; }
    return;
  }
  if(f.hitstun>0){
    f.hitstun--;
    f.vy+=0.9; f.y+=f.vy; f.x+=f.vx; f.vx*=0.93;
    if(f.y>=FLOOR){ f.y=FLOOR; f.vy=0; f.onGround=true; f.vx*=0.7; }
    f.x=clamp(f.x,70,W-70);
    if(f.hitstun<=0){ f.anim='idle'; f.animT=0; f.dizzyMeter=Math.max(0,(f.dizzyMeter||0)-6); }
    return;
  }
  if(f.blockstun>0) f.blockstun--;

  const K=f.slot===0?P1KEYS:P2KEYS;
  let left=keys[K.left], right=keys[K.right], down=keys[K.down], blockBtn=keys[K.block];
  if(f.isCPU){ const ai=cpuThink(f,foe); left=ai.left; right=ai.right; down=ai.down;
               blockBtn=ai.block; f.aiFwd=ai.fwd; f.aiDown=ai.down; }

  if(!f.move && f.dashT<=0 && foe) f.facing = foe.x>f.x?1:-1;
  const back = f.facing>0 ? left : right;
  f.crouch = f.onGround && down && !f.move;
  f.blocking = f.onGround && !f.move && (blockBtn || back);
  f.blockT=f.blocking?f.blockT+1:0;

  /* movement */
  if(f.dashT>0){
    f.dashT--;
    f.x += f.dashDir*11.5;
    if(f.dashT<=0){ f.anim='idle'; f.animT=0; }
  } else {
    let mv=0;
    if(!f.crouch && !f.blocking && f.onGround && !f.move){ if(left) mv-=1; if(right) mv+=1; }
    const spd=f.char.spd*((mv>0)===(f.facing>0)?1:0.78);
    if(f.onGround && !f.move) f.vx=mv*spd;
    if(f.move && f.move.adv && f.moveT>f.move.startup && f.moveT<f.move.startup+f.move.active)
      f.vx=f.facing*f.move.adv;
    else if(f.move && f.onGround) f.vx*=0.8;
    f.x+=f.vx;
  }
  f.vy+=0.9; f.y+=f.vy;
  if(f.y>=FLOOR){
    if(!f.onGround){ sfx('land'); fx.push({t:'dust',x:f.x,y:FLOOR,life:14}); }
    f.y=FLOOR; f.vy=0; f.onGround=true;
  } else f.onGround=false;
  f.x=clamp(f.x,70,W-70);

  /* move progression */
  if(f.move){
    f.moveT++;
    const m=f.move;
    if(m.onFire && f.moveT===m.startup+1) m.onFire(f);
    resolveAttack(f,foe);
    if(f.moveT>m.startup+m.active+m.recover){ f.move=null; f.anim='idle'; f.animT=0; }
  } else {
    if(!f.onGround) f.anim='jump';
    else if(f.dashT>0) f.anim='dash';
    else if(f.crouch) f.anim='crouch';
    else if(f.blocking) f.anim='block';
    else if(Math.abs(f.vx)>0.4) f.anim='walk';
    else f.anim='idle';
  }
}

/* ------------------------------- CPU ----------------------------------- */
function cpuThink(f, foe){
  const D=DIFFS[diff];
  f.aiT--; f.aiBlock--;
  const dx=foe.x-f.x, ad=Math.abs(dx), dir=dx>=0?1:-1;
  if(foe.move && ad<230 && f.aiBlock<-10 && Math.random()<D.blk*0.25) f.aiBlock=26;
  if(f.aiT<=0){
    f.aiT = D.react + Math.random()*D.react;
    const r=Math.random();
    if(f.meter>=100 && ad<260 && r<0.5*D.aggr){ trySuper(f); f.aiMove=0; }
    else if(ad>430){
      if(r<0.35*D.aggr){ startMove(f,'sp1'); f.aiMove=0; }
      else { f.aiMove=dir; if(Math.random()<0.16) tryDash(f,dir); }
    }
    else if(ad>190){ f.aiMove=dir;
      if(Math.random()<0.30*D.aggr) startMove(f,'sp2');
      else if(Math.random()<0.10) tryJump(f); }
    else {
      if(r<0.22*D.aggr) pressAttackCPU(f,'lp');
      else if(r<0.40*D.aggr) pressAttackCPU(f,'hp');
      else if(r<0.56*D.aggr) pressAttackCPU(f,'lk');
      else if(r<0.68*D.aggr) pressAttackCPU(f,'hk');
      else if(r<0.78*D.aggr) startMove(f,'sp1');
      else if(r<0.86) f.aiMove=0;
      else if(r<0.94) f.aiMove=-dir;
      else f.aiMove=dir;
    }
  }
  const blocking=f.aiBlock>0;
  return { left:!blocking&&f.aiMove<0, right:!blocking&&f.aiMove>0,
           down:false, block:blocking, fwd:f.aiMove===dir };
}
function pressAttackCPU(f,key){ startMove(f,key); }

/* =========================================================================
   PROJECTILES
   ========================================================================= */
function stepProjectiles(){
  for(const p of projectiles){
    p.life--;
    const foe = fighters.find(f=>f && f!==p.owner);
    const hurt=(dmg,opt)=>{ if(foe) landHit(foe,p.owner,Object.assign(
      {dmg, kb:8, stun:22, hit:'hitH', reach:60, hy:-160, level:'high', meter:0}, opt||{})); };

    if(p.type==='word'){
      p.x+=p.vx; p.y+=Math.sin(p.life/5+p.wob)*0.8;
      if(foe&&!p.hasHit&&overlap({x:p.x-26,y:p.y-16,w:52,h:32}, bodyBox(foe))){
        p.hasHit=true; p.life=0; hurt(p.dmg,{kb:6,stun:16,hit:'hitL'});
      }
    } else if(p.type==='cinebars'){
      p.t++;
      if(!p.hitDone && p.t>=26 && foe && Math.abs(foe.x-p.x)<140){
        p.hitDone=true; sfx('hitH'); hurt(p.dmg,{stun:36,kb:6});
      }
    } else if(p.type==='nina'){
      p.x+=p.vx; p.ph+=0.5;
      if(foe&&!p.hasHit&&Math.abs(foe.x-p.x)<70&&foe.y>FLOOR-140){
        p.hasHit=true; sfx('bark'); hurt(p.dmg,{launch:true,kb:10});
      }
    } else if(p.type==='banana'){
      if(p.warn>0) p.warn--;
      else{
        p.vy+=1.35; p.y+=p.vy; p.rot+=0.06;
        if(foe&&!p.hasHit&&Math.abs(foe.x-p.x)<80&&p.y>foe.y-280&&p.y<foe.y-40){
          p.hasHit=true; p.life=0; sfx('splat'); hurt(p.dmg,{launch:true});
          projectiles.push({type:'peel',owner:null,x:p.x,y:FLOOR,life:9999});
        }
        if(p.y>=FLOOR-24&&p.life>0){
          p.life=0; sfx('splat'); shake=Math.max(shake,7);
          spark(p.x,FLOOR-30,'#ffe25e',12,1.5);
          projectiles.push({type:'peel',owner:null,x:p.x,y:FLOOR,life:9999});
        }
      }
    } else if(p.type==='peel'){
      for(const f of fighters){
        if(f&&f.anim!=='ko'&&f.hitstun<=0&&f.dizzy<=0&&f.onGround&&
           Math.abs(f.x-p.x)<34&&Math.abs(f.vx)>2.6){
          p.life=0; sfx('boing');
          f.move=null; f.anim='hurt'; f.animT=0; f.hitstun=26;
          f.vx=Math.sign(f.vx)*7; f.vy=-10; f.onGround=false;
          f.bubble='אופס!'; f.bubbleT=1200;
          spark(p.x,FLOOR-20,'#ffe25e',9,1.2);
          break;
        }
      }
    }
  }
  projectiles=projectiles.filter(p=>p.life>0 && (p.x===undefined||(p.x>-140&&p.x<W+140)));
}

    ctx.lineTo(W,220+i*46); ctx.lineTo(0,220+i*46); ctx.fill();
  }
  ctx.restore();
  // peaks
  for(const [px,ph,col] of [[220,300,'#5f7b9c'],[640,380,'#4d688a'],[1050,320,'#5f7b9c']]){
    ctx.fillStyle=col;
    ctx.beginPath(); ctx.moveTo(px-260,FLOOR-60); ctx.lineTo(px,FLOOR-60-ph);
    ctx.lineTo(px+260,FLOOR-60); ctx.fill();
    ctx.fillStyle='#f2f8ff';
    ctx.beginPath(); ctx.moveTo(px-72,FLOOR-60-ph*0.72); ctx.lineTo(px,FLOOR-60-ph);
    ctx.lineTo(px+72,FLOOR-60-ph*0.72);
    ctx.lineTo(px+30,FLOOR-60-ph*0.80); ctx.lineTo(px-6,FLOOR-60-ph*0.70);
    ctx.lineTo(px-40,FLOOR-60-ph*0.80); ctx.fill();
  }
  // pines
  for(let i=0;i<10;i++){
    const x=60+i*138, h=120+((i*53)%70);
    ctx.fillStyle='#20402f';
    ctx.beginPath(); ctx.moveTo(x,FLOOR-58); ctx.lineTo(x+30,FLOOR-58-h); ctx.lineTo(x+60,FLOOR-58); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.8)';
    ctx.beginPath(); ctx.moveTo(x+12,FLOOR-58-h*0.62); ctx.lineTo(x+30,FLOOR-58-h);
    ctx.lineTo(x+48,FLOOR-58-h*0.62); ctx.fill();
  }
  // snowfall
  for(let i=0;i<90;i++){
    const sx=(i*97+t/24+Math.sin(t/700+i)*30)%W, sy=(i*67+t/9)%FLOOR;
    ctx.fillStyle='rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.arc(sx,sy,(i%5===0)?3.2:1.9,0,7); ctx.fill();
  }
  ctx.fillStyle='#eef5fc'; ctx.fillRect(0,FLOOR-46,W,46);
}
const STAGE_DRAW={studio:drawStudio, space:drawSpace, ship:drawShip,
                  barbie:drawBarbie, forest:drawForest, snow:drawSnow};

function drawStageFloor(){
  const s=stageDef(stageId);
  const fl=ctx.createLinearGradient(0,FLOOR,0,H);
  fl.addColorStop(0,s.floor); fl.addColorStop(1,shadeCol(s.floor,-60));
  ctx.fillStyle=fl; ctx.fillRect(0,FLOOR,W,H-FLOOR);
  ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,FLOOR); ctx.lineTo(W,FLOOR); ctx.stroke();
  for(let i=0;i<13;i++){ ctx.strokeStyle='rgba(255,255,255,.05)';
    ctx.beginPath(); ctx.moveTo(W/2+(i-6)*44,FLOOR); ctx.lineTo(W/2+(i-6)*230,H); ctx.stroke(); }
  // gaffer marks stay on the floor wherever we end up — it is still a shoot
  for(const gx of [400,880]){
    ctx.save(); ctx.translate(gx,FLOOR+38);
    ctx.fillStyle='rgba(255,213,74,.75)';
    ctx.save(); ctx.rotate(0.6); rr(ctx,-28,-5,56,10,2); ctx.fill(); ctx.restore();
    ctx.save(); ctx.rotate(-0.6); rr(ctx,-28,-5,56,10,2); ctx.fill(); ctx.restore();
    ctx.restore();
  }
}
function drawStage(){
  const t=performance.now();
  (STAGE_DRAW[stageId]||drawStudio)(t);
  drawStageFloor();
}
/* ---------------------- the chroma key transition ----------------------- */
function startKeyIn(){
  const pick = STAGE_LIST[stageSel];
  stageId = (pick.id==='random')
      ? rnd(STAGE_LIST.filter(s=>s.id!=='random'&&s.id!=='studio')).id
      : pick.id;
  keyIn=0; keyInDone=false;
  setState('KEYIN');
  sfx('key');
  musicPlay('fight');
}
function drawKeyIn(){
  const p=clamp(keyIn/100,0,1);
  drawStage();                                  // the world underneath
  // the green still covering it, dissolving in bands
  const bands=26;
  ctx.save();
  for(let i=0;i<bands;i++){
    const bp = clamp((p*1.5) - (i/bands)*0.5, 0, 1);
    if(bp>=1) continue;
    const y=i*(FLOOR/bands), h=FLOOR/bands+1;
    ctx.save();
    ctx.beginPath(); ctx.rect(0,y,W,h); ctx.clip();
    ctx.globalAlpha=1-bp;
    drawStudio(performance.now());
    ctx.restore();
    // key edge noise
    if(bp>0.02&&bp<0.98){
      ctx.fillStyle='rgba(120,255,170,.5)';
      for(let k=0;k<18;k++){
        const nx=Math.random()*W;
        ctx.fillRect(nx, y+Math.random()*h, 2+Math.random()*8, 2);
      }
    }
  }
  ctx.restore();
  // scan line sweep
  const sy=p*FLOOR;
  const g=ctx.createLinearGradient(0,sy-40,0,sy+40);
  g.addColorStop(0,'rgba(120,255,170,0)'); g.addColorStop(0.5,'rgba(160,255,200,.55)');
  g.addColorStop(1,'rgba(120,255,170,0)');
  ctx.fillStyle=g; ctx.fillRect(0,sy-40,W,80);
  // HUD
  ctx.save();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='900 44px -apple-system, Arial';
  ctx.fillStyle='#0f0f16'; ctx.globalAlpha=0.55;
  rr(ctx,W/2-260,H/2-56,520,112,16); ctx.fill();
  ctx.globalAlpha=1;
  ctx.fillStyle='#7ef2a0';
  ctx.fillText('מפעיל קרומה קי…', W/2, H/2-14);
  ctx.fillStyle='#1c2a22'; rr(ctx,W/2-200,H/2+18,400,20,10); ctx.fill();
  ctx.fillStyle='#7ef2a0'; rr(ctx,W/2-200,H/2+18,400*p,20,10); ctx.fill();
  ctx.font='700 20px Menlo, monospace'; ctx.fillStyle='rgba(255,255,255,.7)';
  ctx.fillText(stageDef(stageId).emoji+'  '+stageDef(stageId).name+'  '+Math.round(p*100)+'%',
               W/2, H/2+58);
  ctx.restore();
}

/* =========================================================================
   THE HEAD GAG — the whole reason this game exists
   ========================================================================= */
function drawHeadSplit(g, f, scale){
  const d=f.data, hc=d.headCanvas;
  if(!hc) return;
  const open=mouthOpen(f);
  const mY=d.cal.mouthFrac*HEADH;
  g.save();
  g.scale(scale,scale);
  g.translate(-HEADW/2,-HEADH);
  const pivX=HEADW*0.15, pivY=mY;
  if(open>0.04){
    g.fillStyle='#42060e';
    g.beginPath(); g.ellipse(HEADW/2, mY+6, 78, 20+open*34, 0, 0, 7); g.fill();
    g.fillStyle='#a03a4a';
    g.beginPath(); g.ellipse(HEADW/2, mY+14+open*22, 40, 12, 0,0,7); g.fill();
  }
  g.save();
  g.translate(pivX,pivY); g.rotate(open*0.13); g.translate(-pivX,-pivY);
  g.translate(0,open*12);
  g.drawImage(hc, 0,mY, HEADW,HEADH-mY, 0,mY, HEADW,HEADH-mY);
  g.restore();
  g.save();
  g.translate(pivX,pivY); g.rotate(-open*0.5); g.translate(-pivX,-pivY);
  g.translate(0,-open*4);
  g.drawImage(hc, 0,0, HEADW,mY+1, 0,0, HEADW,mY+1);
  g.restore();
  g.restore();
}

/* ============================ Nina the dog ============================== */
function drawNina(g,x,y,dir,ph,scale){
  g.save(); g.translate(x,y); g.scale(dir*(scale||1),(scale||1));
  const run=Math.sin(ph*2), run2=Math.cos(ph*2);
  const black='#2b2b2f', tan='#a9793f', cream='#e8ddc8';
  // tail
  g.strokeStyle=black; g.lineWidth=9; g.lineCap='round';
  g.beginPath(); g.moveTo(-34,-40);
  g.quadraticCurveTo(-58,-52+run*8,-70,-34+run*12); g.stroke();
  // back legs
  g.strokeStyle=tan; g.lineWidth=10;
  g.beginPath(); g.moveTo(-24,-26); g.lineTo(-30+run*14,-2); g.stroke();
  g.beginPath(); g.moveTo(-18,-26); g.lineTo(-14-run*14,-2); g.stroke();
  // body
  g.fillStyle=tan; g.beginPath(); g.ellipse(-4,-34,36,20,0,0,7); g.fill();
  g.fillStyle=black; g.beginPath(); g.ellipse(-8,-42,34,15,-0.06,0,7); g.fill();
  g.fillStyle=cream; g.beginPath(); g.ellipse(16,-30,15,12,0,0,7); g.fill();
  // front legs
  g.strokeStyle=tan; g.lineWidth=10;
  g.beginPath(); g.moveTo(14,-28); g.lineTo(20+run2*14,-2); g.stroke();
  g.beginPath(); g.moveTo(20,-28); g.lineTo(26-run2*12,-2); g.stroke();
  // neck + head
  g.fillStyle=black; g.beginPath(); g.ellipse(26,-44,14,12,0.4,0,7); g.fill();
  g.beginPath(); g.ellipse(36,-54,16,14,0,0,7); g.fill();
  // muzzle
  g.fillStyle=cream; g.beginPath(); g.ellipse(50,-50,13,8,0.12,0,7); g.fill();
  g.fillStyle=black; g.beginPath(); g.ellipse(60,-52,4.4,3.6,0,0,7); g.fill();
  // blaze between the eyes
  g.fillStyle=cream; g.beginPath(); g.ellipse(38,-58,4,7,0.2,0,7); g.fill();
  // ears — big and upright, like hers
  g.fillStyle=black;
  g.beginPath(); g.moveTo(30,-64); g.lineTo(26,-88); g.lineTo(40,-68); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(40,-66); g.lineTo(44,-90); g.lineTo(50,-64); g.closePath(); g.fill();
  g.fillStyle='#8a6a4a';
  g.beginPath(); g.moveTo(41,-68); g.lineTo(44,-84); g.lineTo(47,-67); g.closePath(); g.fill();
  // eye
  g.fillStyle='#1a1410'; g.beginPath(); g.arc(44,-56,2.6,0,7); g.fill();
  g.fillStyle='rgba(255,255,255,.8)'; g.beginPath(); g.arc(45,-57,1,0,7); g.fill();
  // tongue
  g.fillStyle='#e2718a';
  g.beginPath(); g.ellipse(54,-43+Math.abs(run)*2,6,4,0.3,0,7); g.fill();
  // red collar
  g.strokeStyle='#c8352f'; g.lineWidth=6;
  g.beginPath(); g.arc(30,-46,14,-0.5,1.9); g.stroke();
  g.fillStyle='#d8d8dc'; g.beginPath(); g.arc(30,-32,3,0,7); g.fill();
  g.restore();
}

/* ========================= props held mid-move ========================== */
function drawProps(g,f,p){
  const m=f.move; if(!m||!m.prop||!f._hands) return;
  const h=f._hands.front, prog=clamp(f.moveT/(m.startup+m.active),0,1);
  if(m.prop==='boom'){
    const len=90+prog*230;
    g.save();
    g.translate(h[0],h[1]);
    g.rotate(-0.5+prog*0.85);
    g.strokeStyle='#2f2f38'; g.lineWidth=8; g.lineCap='round';
    g.beginPath(); g.moveTo(-40,0); g.lineTo(len,0); g.stroke();
    g.strokeStyle='#6a6a78'; g.lineWidth=3;
    g.beginPath(); g.moveTo(-40,0); g.lineTo(len*0.6,0); g.stroke();
    // the blimp / zeppelin windshield
    g.fillStyle='#4a4a56'; g.save(); g.translate(len,0);
    rr(g,-26,-17,58,34,17); g.fill();
    g.fillStyle='#2b2b33'; rr(g,-18,-11,42,22,11); g.fill();
    g.strokeStyle='#6a6a78'; g.lineWidth=2;
    for(let i=0;i<5;i++){ g.beginPath(); g.moveTo(-18+i*11,-11); g.lineTo(-18+i*11,11); g.stroke(); }
    g.restore();
    g.restore();
  } else if(m.prop==='nunchaku'){
    const spin=f.moveT*0.55;
    g.save(); g.translate(h[0],h[1]);
    g.strokeStyle='#1c1c22'; g.lineWidth=7;
    rr(g,-7,-24,14,48,6); g.fillStyle='#3a3a44'; g.fill();
    const cx=Math.cos(spin)*52, cy=Math.sin(spin)*52;
    g.strokeStyle='#c8a63a'; g.lineWidth=3;
    g.beginPath(); g.moveTo(0,-20); g.lineTo(cx,cy); g.stroke();
    g.save(); g.translate(cx,cy); g.rotate(spin);
    g.fillStyle='#3a3a44'; rr(g,-7,-24,14,48,6); g.fill();
    g.strokeStyle='#6a6a78'; g.lineWidth=2; rr(g,-7,-24,14,48,6); g.stroke();
    g.restore();
    g.restore();
  }
}

/* ============================ draw a fighter ============================ */
function currentPose(f){
  if(f.move) return sample(f.move.keys, f.moveT, false);
  const def = moveDef(f, f.anim) || COMMON.idle || STANCE[f.char.style].idle;
  const d2 = def || STANCE[f.char.style].idle;
  return sample(d2.keys, f.animT, d2.loop);
}
function drawFighter(f){
  const p=currentPose(f);
  ctx.save();
  ctx.translate(f.x,f.y);
  ctx.fillStyle='rgba(0,0,0,.32)';
  const sc=clamp(1-(FLOOR-f.y)/420,0.4,1);
  ctx.beginPath(); ctx.ellipse(0,4,56*sc*f.char.weight,11*sc,0,0,7); ctx.fill();
  ctx.scale(f.facing,1);
  if(f.hitstun>0 && Math.floor(performance.now()/50)%2===0) ctx.globalAlpha=0.72;
  if(f.anim==='ko'){
    ctx.translate(0,-40); ctx.rotate(Math.min(Math.PI/2, f.animT*0.09));
    ctx.translate(0,40);
  }
  drawBody(ctx,f,p);
  drawProps(ctx,f,p);
  ctx.restore();

  // stars when dizzy
  if(f.dizzy>0){
    const t=performance.now()/240;
    for(let i=0;i<5;i++){
      const a=t+i*1.256, sx=f.x+Math.cos(a)*44, sy=f.y-268+Math.sin(a)*13;
      drawStar(ctx,sx,sy,10+Math.sin(t*3+i)*2,'#ffd34d');
    }
  }
  if(f.bubble){
    const bx=f.x, by=f.y-330;
    ctx.font='700 21px -apple-system, Arial';
    const w=ctx.measureText(f.bubble).width+30;
    ctx.fillStyle='rgba(255,255,255,.96)';
    rr(ctx,bx-w/2,by-22,w,40,12); ctx.fill();
    ctx.beginPath(); ctx.moveTo(bx-8,by+18); ctx.lineTo(bx+10,by+18); ctx.lineTo(bx+2,by+34); ctx.fill();
    ctx.fillStyle='#181820'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(f.bubble,bx,by-1);
  }
}
function drawStar(g,x,y,r,col){
  g.save(); g.translate(x,y); g.fillStyle=col; g.beginPath();
  for(let i=0;i<10;i++){
    const a=i*Math.PI/5-Math.PI/2, rr2=i%2?r*0.45:r;
    i===0?g.moveTo(Math.cos(a)*rr2,Math.sin(a)*rr2):g.lineTo(Math.cos(a)*rr2,Math.sin(a)*rr2);
  }
  g.closePath(); g.fill(); g.restore();
}

/* ============================= projectiles ============================== */
function drawProjectiles(){
  for(const p of projectiles){
    if(p.type==='word'){
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(Math.sin(p.life/6+p.wob)*0.08);
      ctx.font='900 30px -apple-system, Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.lineWidth=7; ctx.strokeStyle='#1c0b18'; ctx.lineJoin='round';
      ctx.strokeText(p.text,0,0);
      ctx.fillStyle='#ffd34d'; ctx.fillText(p.text,0,0); ctx.restore();
    }
    else if(p.type==='cinebars'){
      let prog; if(p.t<26) prog=ease(p.t/26); else if(p.t<44) prog=1; else prog=1-ease((p.t-44)/24);
      const meetY=430, bw=290;
      ctx.fillStyle='#050505';
      ctx.fillRect(p.x-bw/2,0,bw,meetY*prog);
      ctx.fillRect(p.x-bw/2,H-(H-meetY-40)*prog,bw,(H-meetY-40)*prog);
      ctx.globalAlpha=0.3*prog;
      ctx.fillStyle='#ff8c42'; ctx.fillRect(p.x-bw/2-36,0,36,H);
      ctx.fillStyle='#2ec4b6'; ctx.fillRect(p.x+bw/2,0,36,H);
      ctx.globalAlpha=1;
      if(p.t>=22&&p.t<=46){
        ctx.font='900 26px Arial'; ctx.textAlign='center'; ctx.fillStyle='#fff';
        ctx.fillText('🎬 גריידינג 🎬', p.x, 52);
      }
    }
    else if(p.type==='nina'){
      drawNina(ctx,p.x,FLOOR,Math.sign(p.vx),p.ph,1.15);
      ctx.font='800 20px -apple-system, Arial'; ctx.textAlign='center';
      ctx.fillStyle='#fff'; ctx.shadowColor='rgba(0,0,0,.7)'; ctx.shadowBlur=6;
      ctx.fillText('וואף!', p.x-Math.sign(p.vx)*54, FLOOR-118);
      ctx.shadowBlur=0;
    }
    else if(p.type==='banana'){
      if(p.warn>0){
        if(Math.floor(p.warn/4)%2===0){
          ctx.strokeStyle='rgba(255,226,94,.8)'; ctx.lineWidth=3;
          ctx.beginPath(); ctx.ellipse(p.x,FLOOR,58,12,0,0,7); ctx.stroke();
          ctx.font='32px Arial'; ctx.textAlign='center'; ctx.fillText('🍌',p.x,86);
        }
      } else {
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(0.5+p.rot);
        ctx.strokeStyle='#f6d032'; ctx.lineWidth=36; ctx.lineCap='round';
        ctx.beginPath(); ctx.arc(0,-30,76,0.45,2.7); ctx.stroke();
        ctx.strokeStyle='#5a4a18'; ctx.lineWidth=10;
        ctx.beginPath(); ctx.arc(0,-30,76,0.45,0.62); ctx.stroke();
        ctx.beginPath(); ctx.arc(0,-30,76,2.55,2.7); ctx.stroke();
        ctx.restore();
      }
    }
    else if(p.type==='peel'){
      ctx.save(); ctx.translate(p.x,FLOOR-6); ctx.fillStyle='#f6d032';
      for(const a of [-0.9,-0.3,0.3,0.9]){
        ctx.beginPath(); ctx.ellipse(Math.sin(a)*17,-4,8,21,a,0,7); ctx.fill();
      }
      ctx.fillStyle='#d9b32a'; ctx.beginPath(); ctx.arc(0,-4,9,0,7); ctx.fill();
      ctx.restore();
    }
  }
}

/* ================================ FX =================================== */
function drawFX(){
  if(impactFlash>0){
    ctx.fillStyle=impactTone; ctx.globalAlpha=impactFlash/34;
    ctx.fillRect(0,0,W,H); ctx.globalAlpha=1;
  }
  for(const e of fx){
    if(e.t==='spark'){
      ctx.globalAlpha=clamp(e.life/14,0,1); ctx.fillStyle=e.col;
      ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,7); ctx.fill(); ctx.globalAlpha=1;
    }
    else if(e.t==='impact'){
      const k=1-e.life/(e.big?16:12);
      ctx.save(); ctx.translate(e.x,e.y); ctx.rotate(e.life*0.3);
      ctx.fillStyle=`rgba(255,255,255,${1-k})`;
      const R=(e.big?60:38)*(0.5+k);
      ctx.beginPath();
      for(let i=0;i<12;i++){ const a=i*Math.PI/6, r=i%2?R*0.42:R;
        i===0?ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r):ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r); }
      ctx.closePath(); ctx.fill(); ctx.restore();
    }
    else if(e.t==='dust'){
      const k=1-e.life/14;
      ctx.globalAlpha=(1-k)*0.5; ctx.fillStyle='#d8d0c4';
      ctx.beginPath(); ctx.ellipse(e.x,e.y-6,26+k*36,8,0,0,7); ctx.fill(); ctx.globalAlpha=1;
    }
    else if(e.t==='paper'){
      ctx.save(); ctx.translate(e.x,e.y); ctx.rotate(e.rot);
      ctx.fillStyle='#fdfdf6'; rr(ctx,-16,-22,32,44,3); ctx.fill();
      ctx.strokeStyle='#c9c9bd'; ctx.lineWidth=1.6;
      for(let i=0;i<5;i++){ ctx.beginPath(); ctx.moveTo(-11,-14+i*8); ctx.lineTo(11,-14+i*8); ctx.stroke(); }
      ctx.fillStyle='#2b4fbf'; ctx.font='9px Arial'; ctx.textAlign='center';
      ctx.fillText('חוזה',0,20); ctx.restore();
    }
    else if(e.t==='render'){
      const p=clamp(e.t2/70,0,1);
      ctx.save(); ctx.globalAlpha=0.55*(1-Math.max(0,(e.t2-80)/30));
      ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H); ctx.restore();
      ctx.fillStyle='rgba(20,20,26,.92)'; rr(ctx,W/2-300,H/2-70,600,140,16); ctx.fill();
      ctx.strokeStyle='#2ec4b6'; ctx.lineWidth=3; rr(ctx,W/2-300,H/2-70,600,140,16); ctx.stroke();
      ctx.font='900 34px -apple-system, Arial'; ctx.textAlign='center'; ctx.fillStyle='#2ec4b6';
      ctx.fillText('רנדר סופי', W/2, H/2-18);
      ctx.fillStyle='#16221f'; rr(ctx,W/2-250,H/2+8,500,26,13); ctx.fill();
      ctx.fillStyle='#2ec4b6'; rr(ctx,W/2-250,H/2+8,500*p,26,13); ctx.fill();
      ctx.font='700 18px Menlo, monospace'; ctx.fillStyle='#fff';
      ctx.fillText(Math.floor(p*100)+'%  ·  אין דרך חזרה', W/2, H/2+56);
    }
    else if(e.t==='timeline'){
      const p=clamp(e.t2/70,0,1);
      ctx.fillStyle='rgba(14,14,20,.9)'; ctx.fillRect(0,H/2-120,W,240);
      for(let i=0;i<3;i++){
        ctx.fillStyle=['#3a6ea8','#8a3a6e','#3a8a5e'][i];
        rr(ctx,60,H/2-96+i*72,W-120,54,6); ctx.fill();
        ctx.fillStyle='rgba(255,255,255,.16)';
        for(let k=0;k<28;k++) ctx.fillRect(70+k*42,H/2-92+i*72,3,46);
      }
      const px=60+(W-120)*p;
      ctx.strokeStyle='#ff3b30'; ctx.lineWidth=4;
      ctx.beginPath(); ctx.moveTo(px,H/2-120); ctx.lineTo(px,H/2+120); ctx.stroke();
      ctx.fillStyle='#ff3b30'; ctx.beginPath();

      ctx.fillStyle='#1d1d24'; rr(ctx,-130,-90,260,180,10); ctx.fill();
      ctx.strokeStyle='#9aa0b0'; ctx.lineWidth=7; rr(ctx,-130,-90,260,180,10); ctx.stroke();
      for(const cx2 of [-130,130]) { ctx.fillStyle='#9aa0b0';
        rr(ctx,cx2-13,-90,26,180,6); ctx.fill(); }
      ctx.fillStyle='#ffd34d'; ctx.font='900 26px -apple-system, Arial'; ctx.textAlign='center';
      ctx.fillText('ציוד', 0, 8);
      ctx.fillStyle='#fff'; ctx.font='700 14px Arial';
      ctx.fillText('SUN VIDEO', 0, 34);
      ctx.restore();
      if(p>=1){ ctx.font='900 40px -apple-system, Arial'; ctx.textAlign='center';
        ctx.fillStyle='#ffd34d'; ctx.fillText('הכל חוזר לארגז!', W/2, 150); }
    }
    else if(e.t==='fader'){
      const p=clamp(e.t2/55,0,1);
      ctx.save(); ctx.translate(e.x,0);
      ctx.fillStyle='#1a1a22'; rr(ctx,-90,-40,180,FLOOR-40,12); ctx.fill();
      ctx.strokeStyle='#4a4a5a'; ctx.lineWidth=4; rr(ctx,-90,-40,180,FLOOR-40,12); ctx.stroke();
      ctx.fillStyle='#0d0d12'; rr(ctx,-16,20,32,FLOOR-120,16); ctx.fill();
      for(let i=0;i<10;i++){ ctx.fillStyle='rgba(255,255,255,.35)';
        ctx.fillRect(-56,40+i*((FLOOR-140)/10),26,3); }
      const kn=40+ (FLOOR-150)*ease(p);
      ctx.fillStyle='#e8e8ee'; rr(ctx,-52,kn-20,104,40,8); ctx.fill();
      ctx.fillStyle='#ff3b30'; rr(ctx,-52,kn-3,104,6,3); ctx.fill();
      ctx.restore();
      ctx.font='900 34px -apple-system, Arial'; ctx.textAlign='center';
      ctx.fillStyle= p>0.9?'#ff3b30':'#fff';
      ctx.fillText(p>0.9?'−∞ dB · MUTED':'מוריד את הפיידר…', W/2, 120);
    }
    else if(e.t==='spotlight'){
      const a=clamp(1-e.t2/28,0,1);
      ctx.fillStyle=`rgba(255,255,240,${a*0.85})`; ctx.fillRect(0,0,W,H);
    }
    else if(e.t==='orbit'){
      const p=clamp(e.t2/70,0,1);
      ctx.fillStyle=`rgba(6,6,14,${0.75*p})`; ctx.fillRect(0,0,W,H);
      for(let i=0;i<70;i++){
        const sx=(i*173)%W, sy=(i*97)%H;
        ctx.fillStyle=`rgba(255,255,255,${p*(0.3+0.6*Math.abs(Math.sin(i)))})`;
        ctx.fillRect(sx,sy,2,2);
      }
      ctx.font='60px Arial'; ctx.textAlign='center';
      ctx.fillText('🌕', 200+p*40, 140);
    }
    else if(e.t==='blast'){
      const p=1-e.life/40;
      ctx.save(); ctx.translate(e.x,e.y);
      ctx.globalAlpha=1-p;
      const R=40+p*300;
      const g=ctx.createRadialGradient(0,0,10,0,0,R);
      g.addColorStop(0,'#fff'); g.addColorStop(0.35,'#ffd34d');
      g.addColorStop(0.7,'#ff5e3a'); g.addColorStop(1,'rgba(255,60,40,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,R,0,7); ctx.fill();
      ctx.restore(); ctx.globalAlpha=1;
    }
    else if(e.t==='text'){
      const p=clamp(e.life/24,0,1);
      ctx.save(); ctx.globalAlpha=p;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.font='900 '+(e.size||46)+'px -apple-system, Arial';
      ctx.lineWidth=10; ctx.strokeStyle='#1c0b18'; ctx.lineJoin='round';
      ctx.strokeText(e.txt,e.x,e.y); ctx.fillStyle=e.col||'#ffd34d';
      ctx.fillText(e.txt,e.x,e.y); ctx.restore();
    }
  }
}
function stepFX(){
  for(const e of fx){
    e.life--;
    if(e.t==='spark'){ e.x+=e.vx; e.y+=e.vy; e.vy+=0.45; }
    else if(e.t==='paper'){ e.y+=e.vy; e.rot+=e.vr; e.x+=Math.sin(e.y/40)*1.6; }
    else if(e.t==='text'){ e.y-=0.6; }
    else if(e.t2!==undefined) e.t2++;
  }
  fx=fx.filter(e=>e.life>0);
}

function drawPortrait(d,x,y,size,flip){
  ctx.save(); ctx.translate(x,y); if(flip) ctx.scale(-1,1);

function drawHUD(){
  const barW=430, barH=26, y=24;
  for(const [f,side] of [[fighters[0],0],[fighters[1],1]]){
    if(!f) continue;
    const x0 = side===0? 96 : W-96-barW;
    ctx.fillStyle='rgba(0,0,0,.5)'; rr(ctx,x0-5,y-5,barW+10,barH+10,8); ctx.fill();
    ctx.fillStyle='#3a3a44'; rr(ctx,x0,y,barW,barH,5); ctx.fill();
    const pct=f.hp/100, wpx=barW*pct;
    if(wpx>2){
      const grd=ctx.createLinearGradient(x0,0,x0+barW,0);
      grd.addColorStop(0,'#ffe25e'); grd.addColorStop(1,'#ff5e3a');
      ctx.fillStyle=grd;
      if(side===0) rr(ctx,x0+barW-wpx,y,wpx,barH,5); else rr(ctx,x0,y,wpx,barH,5);
      ctx.fill();
    }
    drawPortrait(f.data, side===0?52:W-52, 8, 62, side===1);
    ctx.font='800 19px -apple-system, Arial'; ctx.fillStyle='#fff';
    ctx.textAlign= side===0?'left':'right'; ctx.textBaseline='top';
    ctx.shadowColor='rgba(0,0,0,.75)'; ctx.shadowBlur=6;
    ctx.fillText(f.data.name+(f.isCPU?' (מחשב)':'')+' · '+f.char.art,
      side===0? x0+2 : x0+barW-2, y+barH+8);
    ctx.shadowBlur=0;
    for(let i=0;i<2;i++){
      const px= side===0? x0+barW-16-i*24 : x0+16+i*24;
      ctx.beginPath(); ctx.arc(px,y+barH+20,8,0,7);
      ctx.fillStyle= wins[side]>i? '#ffd34d':'rgba(255,255,255,.25)'; ctx.fill();
    }
    // super meter
    const sx= side===0? x0 : x0+barW-190;
    ctx.fillStyle='rgba(0,0,0,.45)'; rr(ctx,sx,y+barH+34,190,13,7); ctx.fill();
    const full=f.meter>=100;
    ctx.fillStyle= full? (Math.floor(performance.now()/120)%2? '#fff':'#ffd34d') : '#9ad1ff';
    rr(ctx,sx+2,y+barH+36,Math.max(2,186*(f.meter/100)),9,5); ctx.fill();
    ctx.font='700 12px -apple-system, Arial'; ctx.textAlign= side===0?'left':'right';
    ctx.fillStyle= full? '#ffd34d':'rgba(255,255,255,.75)';
    ctx.fillText(full? '🔥 מהלך סיום מוכן! (אגרוף+בעיטה)' : f.char.sup,
      side===0? sx : sx+190, y+barH+50);
    // combo counter
    if(f.comboHits>1 && f.comboT>0){
      const cx= side===0? 150: W-150;
      ctx.font='900 40px -apple-system, Arial'; ctx.textAlign='center';
      ctx.fillStyle='#ffd34d'; ctx.strokeStyle='#1c0b18'; ctx.lineWidth=8; ctx.lineJoin='round';
      ctx.strokeText(f.comboHits+' מכות!', cx, 190);
      ctx.fillText(f.comboHits+' מכות!', cx, 190);
    }
  }
  // timer
  ctx.fillStyle='rgba(0,0,0,.6)'; ctx.beginPath(); ctx.arc(W/2,y+22,36,0,7); ctx.fill();
  ctx.strokeStyle= roundTimer<10?'#ff5e3a':'#ffd34d'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.arc(W/2,y+22,36,0,7); ctx.stroke();
  ctx.font='800 31px -apple-system, Arial'; ctx.fillStyle= roundTimer<10?'#ff8a70':'#fff';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(String(Math.ceil(roundTimer)), W/2, y+24);
  const secs=Math.max(0,99-roundTimer);
  const ss=String(Math.floor(secs)).padStart(2,'0'), ff=String(Math.floor((secs%1)*25)).padStart(2,'0');
  if(Math.floor(performance.now()/500)%2===0){
    ctx.fillStyle='#ff3b30'; ctx.beginPath(); ctx.arc(W/2-54,y+68,5,0,7); ctx.fill();
  }
  ctx.font='700 13px Menlo, Courier, monospace'; ctx.fillStyle='rgba(255,255,255,.85)';
  ctx.fillText('REC 00:'+ss+':'+ff, W/2+8, y+68);
}

/* ------------------------------ finisher -------------------------------- */
function stepFinish(){
  finish.t++;
  const {winner,loser}=finish;
  if(!winner||!loser) return;
  loser.animT++; winner.animT++;
  if(loser.bubbleT>0) loser.bubbleT-=DT;
  if(winner.bubbleT>0) winner.bubbleT-=DT;

  if(finish.phase===0){
    if(finish.t===12) fx.push({t:'text',x:W/2,y:200,txt:'מהלך סיום!',col:'#ff5e3a',size:64,life:70});
    if(finish.t>=96){
      finish.phase=1; finish.t=0;
      winner.move=Object.assign({},SPECIALS[winner.char.id].sup,{key:'sup',hitLanded:true});
      winner.moveT=0;
      if(winner.move.onStart) winner.move.onStart(winner);
      say(winner,'kiai',charLine(winner,'fin'));
    }
  } else if(finish.phase===1){
    const m=winner.move;
    if(m){
      winner.moveT++;
      if(m.onFire && winner.moveT===m.startup+1) m.onFire(winner);
      if(winner.moveT>m.startup+m.active+6){
        finish.phase=2; finish.t=0;
        sfx('explode'); shake=26;
        fx.push({t:'blast', x:loser.x, y:loser.y-150, life:40});
        for(let i=0;i<26;i++)
          fx.push({t:'spark',x:loser.x,y:loser.y-150,vx:(Math.random()-0.5)*26,
            vy:(Math.random()-0.9)*20,life:36+Math.random()*20,
            col:rnd(['#ffd34d','#ff5e3a','#fff','#9ad1ff']),r:3+Math.random()*5});
        loser.anim='ko'; loser.animT=0;
        loser.vx=(loser.x<winner.x?-1:1)*17; loser.vy=-21; loser.onGround=false;
      }
    } else { finish.phase=2; finish.t=0; }
  } else {
    loser.vy+=0.55; loser.y+=loser.vy; loser.x+=loser.vx; loser.vx*=0.995;
    if(finish.t===26){
      const L=[['גאי','נמחק מהקרדיטים'],['אלי','נשלח לרנדר מחדש'],['אביב','נחתך מהגרסה הסופית'],
               ['דודי','נארז עם הציוד'],['תומר','הושתק לצמיתות'],['עדי','נשלח לירח']];
      const line=(L.find(x=>x[0]===loser.data.name)||['','הודח מהסט'])[1];
      fx.push({t:'text',x:W/2,y:250,txt:loser.data.name+' '+line,col:'#fff',size:44,life:120});
    }
    if(finish.t>96){
      setState('MATCH_END');
      confetti=[];
      for(let i=0;i<170;i++) confetti.push({x:Math.random()*W,y:-Math.random()*H,
        vy:2+Math.random()*3,vx:(Math.random()-0.5)*2,
        col:`hsl(${Math.random()*360},90%,62%)`, r:4+Math.random()*5, ph:Math.random()*7});
      winner.anim='win'; winner.animT=0;
      say(winner,'win',charLine(winner,'win'));
      musicPlay('menu');
      announce('Winner');
    }
  }
}

/* =========================================================================
   UPDATE
   ========================================================================= */
function update(){
  stateT+=DT;
  if(impactFlash>0) impactFlash--;
  if(['TITLE','MODE','DIFF','STAGE','SELECT'].includes(state)) musicPlay('menu');

  if(state==='VS'&&stateT>3600) startKeyIn();
  if(state==='KEYIN'){
    keyIn+=1.5;
    if(keyIn>=104){ musicPlay(stageDef(stageId).music); beginFight(); }
  }
  if(state==='ROUND_INTRO'){
    if(stateT>700&&!roundClap){ roundClap=true; sfx('clap'); }
    if(stateT>1700){ setState('FIGHT'); announce('Action!'); }
  }
  if(state==='FIGHT'&&!paused){
    if(hitstop>0) hitstop--;
    else if(freeze>0) freeze--;
    else{
      const [a,b]=fighters;
      stepFighter(a,b); stepFighter(b,a);
      const dx=b.x-a.x;
      if(Math.abs(dx)<78 && Math.abs(a.y-b.y)<170){
        const push=(78-Math.abs(dx))/2*(dx>=0?1:-1);
        a.x=clamp(a.x-push,70,W-70); b.x=clamp(b.x+push,70,W-70);
      }
      stepProjectiles();
      const prev=Math.ceil(roundTimer);
      roundTimer-=DT/1000*(slowmo>0?0.4:1);
      if(slowmo>0) slowmo--;
      if(Math.ceil(roundTimer)!==prev && roundTimer<10 && roundTimer>0) sfx('tick');
      if(roundTimer<=0){
        roundTimer=0;
        const [f0,f1]=fighters;
        const winner=f0.hp===f1.hp?null:(f0.hp>f1.hp?f0:f1);
        if(winner) startKO(fighters[1-winner.slot],winner);
        else { wins[0]++; wins[1]++; setState('ROUND_END'); }
      }
    }
  }
  if(state==='ROUND_END'){
    if(hitstop>0) hitstop--;
    for(const f of fighters) if(f) stepFighter(f, other(f));
    if(koPair && stateT>800 && !koPair.said){
      koPair.said=true; say(koPair.winner,'win',charLine(koPair.winner,'win'));
    }
    const matchOver = wins[0]>=2 || wins[1]>=2;
    if(matchOver && stateT>1900 && koPair) startFinisher(koPair.winner, koPair.loser);
    else if(!matchOver && stateT>2600){ round++; startRound(); beginFight(); }
  }
  if(state==='FINISH') stepFinish();
  if(state==='MATCH_END'){
    for(const c of confetti){ c.y+=c.vy; c.x+=c.vx+Math.sin(c.ph+performance.now()/300)*1.2;
      if(c.y>H+20){ c.y=-20; c.x=Math.random()*W; } }
    if(fighters[0]) fighters[0].animT++;
    if(fighters[1]) fighters[1].animT++;
  }
  stepFX();
  if(shake>0) shake*=0.86;
}
